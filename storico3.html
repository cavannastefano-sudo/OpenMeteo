<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Storico Meteo Piacenza (1974-1990)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 14px; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #2c3e50; color: white; font-size: 16px; }
        .controls { margin-bottom: 20px; font-size: 18px; }
        select { font-size: 16px; padding: 5px; }
    </style>
</head>
<body>

    <h1>Storico Meteo Piacenza (1981-2000)</h1>
    
    <div class="controls">
        <label for="yearSelect">Seleziona Anno: </label>
        <select id="yearSelect"></select>
    </div>

    <table id="weatherTable">
        <thead>
            <tr>
                <th>Data</th><th>Max</th><th>Percepita</th><th>Min</th>
                <th>Pressione</th><th>Vento (Vel. e Dir.)</th><th>Umidità (%)</th><th>Pioggia</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let weatherData = null;

        function getWindDirection(degrees) {
            const sectors = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            degrees += 22.5;
            if (degrees < 0) degrees = 360 - (Math.abs(degrees) % 360);
            else degrees = degrees % 360;
            return sectors[parseInt(degrees / 45)];
        }

        // URL aggiornato con start_date 1981-01-01 e end_date 2000-12-31
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=45.0483&longitude=9.6953&start_date=1974-01-01&end_date=1990-12-31&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,pressure_msl_mean,wind_speed_10m_max,wind_direction_10m_dominant,relative_humidity_2m_mean,precipitation_sum&timezone=auto`;

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("Errore nel caricamento dati");
                return response.json();
            })
            .then(data => {
                weatherData = data.daily;
                const yearSelect = document.getElementById("yearSelect");
                // Filtro anni per range 1981-2000
                const years = [...new Set(weatherData.time.map(t => t.split("-")[0]))]
                    .filter(y => y >= 1981 && y <= 2000)
                    .reverse();
                
                years.forEach(y => {
                    const opt = document.createElement("option");
                    opt.value = y;
                    opt.innerHTML = y;
                    yearSelect.appendChild(opt);
                });

                yearSelect.onchange = updateTable;
                updateTable(); 
            })
            .catch(err => console.error("Errore:", err));

        function updateTable() {
            if (!weatherData) return;
            
            const selectedYear = document.getElementById("yearSelect").value;
            const tbody = document.querySelector("#weatherTable tbody");
            tbody.innerHTML = "";
            
            for (let i = weatherData.time.length - 1; i >= 0; i--) {
                if (weatherData.time[i].startsWith(selectedYear)) {
                    const dir = getWindDirection(weatherData.wind_direction_10m_dominant[i]);
                    
                    tbody.innerHTML += `<tr>
                        <td>${weatherData.time[i]}</td>
                        <td>${weatherData.temperature_2m_max[i]}°C</td>
                        <td>${weatherData.apparent_temperature_max[i]}°C</td>
                        <td>${weatherData.temperature_2m_min[i]}°C</td>
                        <td>${weatherData.pressure_msl_mean[i]} hPa</td>
                        <td>${weatherData.wind_speed_10m_max[i]} km/h ${dir}</td>
                        <td>${weatherData.relative_humidity_2m_mean[i]}%</td>
                        <td>${weatherData.precipitation_sum[i]} mm</td>
                    </tr>`;
                }
            }
        }
    </script>
</body>
</html>
