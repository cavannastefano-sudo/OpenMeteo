<!DOCTYPE html>
<html lang="it" data-theme="cavanweb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoCWEB - Mappa Interattiva</title>
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#728890" id="meta-theme-color">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }
        #map {
            height: 550px;
            width: 100%;
            border-radius: 1.5rem;
            z-index: 10;
        }
        input[type="search"]::-webkit-search-cancel-button {
            display: none;
        }
    </style>
</head>
<body class="bg-[#728890] min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-8" id="app-body">

    <!-- HEADER DINAMICO -->
    <div id="header-container" class="w-full max-w-6xl mx-auto mb-6">
        <!-- Verrà iniettato via JS -->
    </div>

    <!-- MAIN CONTAINER -->
    <main id="main-container" class="w-full max-w-6xl mx-auto space-y-4 flex-grow flex flex-col justify-center">
        <!-- Verrà iniettato via JS -->
    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-4xl mx-auto text-center mt-6 text-xs space-y-2">
        <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-2">
            <p class="text-xs" id="footer-app-text">Scarica la mia app ufficiale:</p>
            <a href="https://play.google.com/store/apps/details?id=com.cavanweb.com1v10" target="_blank" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border transition shadow text-xs font-semibold group" title="Scarica da Google Play" id="playstore-btn">
                <i class="fa-brands fa-google-play text-amber-400 text-sm group-hover:scale-110 transition"></i>
                <span>Google Play Store</span>
            </a>
        </div>
        <p id="footer-copy">MeteoCWEB • Sviluppato con Tailwind CSS & Leaflet</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const API_KEY = "bd940445d9a0cc5d54dc2b7b498ba441";
        let map = null;
        let marker = null;
        let currentLat = 45.0483;
        let currentLon = 9.6953;
        let currentPlaceName = "Piacenza";

        function toggleTheme() {
            const current = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            let next = 'light';
            if (current === 'cavanweb') next = 'light';
            else if (current === 'light') next = 'dark';
            else next = 'cavanweb';
            setTheme(next);
        }

        function setTheme(themeName) {
            localStorage.setItem('cavanweb_theme', themeName);
            const body = document.getElementById('app-body');
            const metaTheme = document.getElementById('meta-theme-color');
            const footerAppText = document.getElementById('footer-app-text');
            const playStoreBtn = document.getElementById('playstore-btn');
            const footerCopy = document.getElementById('footer-copy');

            if (themeName === 'dark') {
                body.className = "bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 min-h-screen text-white flex flex-col justify-between p-4 sm:p-8";
                metaTheme.setAttribute("content", "#0f172a");
                footerAppText.className = "text-xs text-blue-200";
                playStoreBtn.className = "inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-xl border border-white/20 transition shadow text-xs font-semibold text-white group";
                footerCopy.className = "text-blue-300/60";
            } else if (themeName === 'light') {
                body.className = "bg-[#f1f5f9] min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-8";
                metaTheme.setAttribute("content", "#f1f5f9");
                footerAppText.className = "text-xs text-slate-600";
                playStoreBtn.className = "inline-flex items-center gap-2 bg-slate-200 hover:bg-slate-300 px-3.5 py-1.5 rounded-xl border border-slate-300 transition shadow text-xs font-semibold text-slate-800 group";
                footerCopy.className = "text-slate-500";
            } else {
                body.className = "bg-[#728890] min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-8";
                metaTheme.setAttribute("content", "#728890");
                footerAppText.className = "text-xs text-slate-200";
                playStoreBtn.className = "inline-flex items-center gap-2 bg-[#D8D9D0]/40 hover:bg-[#D8D9D0]/70 px-3.5 py-1.5 rounded-xl border border-slate-600/30 transition shadow text-xs font-semibold text-slate-900 group";
                footerCopy.className = "text-slate-200/80";
            }

            renderLayout();
            initMap();
        }

        function renderLayout() {
            const currentTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            const headerContainer = document.getElementById('header-container');
            const mainContainer = document.getElementById('main-container');

            let themeIcon = "fa-palette";
            let themeLabel = "Tema";
            if (currentTheme === 'cavanweb') { themeIcon = "fa-desktop"; themeLabel = "CavanWeb"; }
            else if (currentTheme === 'light') { themeIcon = "fa-sun"; themeLabel = "Chiaro"; }
            else if (currentTheme === 'dark') { themeIcon = "fa-moon"; themeLabel = "Scuro"; }

            const themeButtonHTML = `
                <button onclick="toggleTheme()" title="Cambia Tema" class="${currentTheme === 'dark' ? 'bg-white/10 hover:bg-white/25 text-amber-400 border-white/20' : currentTheme === 'cavanweb' ? 'bg-[#D8D9D0] hover:bg-white text-slate-800 border-slate-400' : 'bg-amber-500 hover:bg-amber-600 text-white border-amber-600'} px-3.5 h-12 rounded-2xl border shadow transition flex items-center justify-center gap-2 text-sm font-semibold flex-shrink-0">
                    <i class="fa-solid ${themeIcon}"></i> <span class="hidden sm:inline">${themeLabel}</span>
                </button>
            `;

            if (currentTheme === 'dark') {
                headerContainer.className = "w-full max-w-5xl mx-auto mb-6 flex items-center justify-between px-2 sm:px-4 relative";
                headerContainer.innerHTML = `
                    <a href="https://www.cavanweb.com/" target="_blank" class="flex items-center group flex-shrink-0" title="Visita CavanWeb">
                        <img src="SfondoN-512.png" alt="Logo" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl object-cover aspect-square border border-white/20 shadow-lg group-hover:scale-105 transition">
                    </a>
                    <div class="text-center flex-grow mx-2">
                        <h1 class="text-xl sm:text-3xl font-bold tracking-tight mb-0.5 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-earth-americas text-amber-400"></i> Mappa Interattiva
                        </h1>
                        <p class="text-blue-200 text-xs sm:text-sm">Seleziona una località sulla mappa</p>
                    </div>
                    <div class="flex items-center gap-2">
                        ${themeButtonHTML}
                        <div class="relative flex-shrink-0">
                            <button onclick="toggleMenu()" id="menu-btn" title="Menu" class="bg-white/10 hover:bg-white/25 w-12 h-12 rounded-2xl border border-white/20 shadow transition text-blue-200 hover:text-white flex items-center justify-center text-lg font-semibold">
                                <i class="fa-solid fa-bars"></i>
                            </button>
                            <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-60 bg-slate-900/95 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl py-2 z-50 flex flex-col gap-1 px-2">
                                <div class="px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-amber-400 border-b border-white/10 flex items-center gap-1.5"><i class="fa-solid fa-star"></i> Navigazione</div>
                                <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-sm font-semibold transition"><i class="fa-solid fa-cloud-sun text-amber-400 w-5 text-center"></i> <span>Dashboard Meteo</span></a>
                                <a href="archivio.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-sm font-semibold transition"><i class="fa-solid fa-calendar-days text-amber-400 w-5 text-center"></i> <span>Archivio Storico</span></a>
                                <a href="https://cavannastefano-sudo.github.io/OrologioSolare/index.html" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-sm font-semibold transition"><i class="fa-solid fa-clock text-amber-400 w-5 text-center"></i> <span>SunClock24</span></a>
                                <a href="https://www.blog.cavanweb.com/p/blog-page_31.html" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-sm font-semibold transition"><i class="fa-solid fa-globe text-amber-400 w-5 text-center"></i> <span>Meteo Europa</span></a>
                            </div>
                        </div>
                    </div>
                `;

                mainContainer.className = "w-full max-w-4xl mx-auto space-y-4 flex-grow";
                mainContainer.innerHTML = `
                    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-6 sm:p-8 shadow-2xl w-full space-y-4">
                        <div class="flex flex-wrap items-center gap-3">
                            <div class="relative flex-grow">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-blue-300"><i class="fa-solid fa-magnifying-glass text-sm"></i></span>
                                <input type="text" id="search-input" placeholder="Cerca località sulla mappa..." class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-blue-300/60 focus:outline-none focus:border-amber-400 text-sm sm:text-base transition">
                            </div>
                            <button onclick="handleSearch()" class="bg-amber-500 hover:bg-amber-600 px-6 py-3 rounded-2xl font-semibold text-slate-900 transition shadow-lg text-sm sm:text-base">Cerca</button>
                        </div>
                        <div id="map"></div>
                        <div class="text-center text-xs text-blue-200/80">Clicca un punto qualsiasi sulla mappa o cerca una città per selezionarla.</div>
                    </div>
                `;
            } else {
                const isCavanWeb = (currentTheme === 'cavanweb');
                const headerBgClass = isCavanWeb ? "bg-[#D8D9D0] border-slate-400" : "bg-white border-slate-200";
                const cardBgClass = isCavanWeb ? "bg-[#D8D9D0] border-slate-400 text-slate-800" : "bg-white border-slate-300 text-slate-800";
                const dropdownBgClass = isCavanWeb ? "bg-[#8FBBD0] border-[#800040]/50" : "bg-white border-slate-200";

                headerContainer.className = `w-full max-w-6xl mx-auto mb-6 ${headerBgClass} border rounded-3xl p-4 shadow-sm space-y-4 relative`;
                headerContainer.innerHTML = `
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <a href="https://www.cavanweb.com/" target="_blank" class="flex items-center group flex-shrink-0" title="Visita CavanWeb">
                                <img src="SfondoN-512.png" alt="Logo" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl object-cover aspect-square border border-slate-300 shadow-sm group-hover:scale-105 transition">
                            </a>
                            ${themeButtonHTML}
                        </div>
                        <div class="relative flex-shrink-0">
                            <button onclick="toggleMenu()" id="menu-btn" title="Menu" class="bg-[#800040] hover:bg-[#600030] px-4 py-2.5 rounded-lg shadow transition text-white flex items-center gap-2 text-base font-semibold">
                                <i class="fa-solid fa-bars"></i> <span>Menu</span>
                            </button>
                            <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-60 ${dropdownBgClass} border rounded-xl shadow-xl py-2 z-50 flex flex-col gap-1 px-2 text-[#800040] text-base">
                                <div class="px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-[#800040] border-b ${isCavanWeb ? 'border-[#800040]/30' : 'border-slate-100'} flex items-center gap-1.5"><i class="fa-solid fa-star text-[#800040]"></i> Navigazione</div>
                                <a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg ${isCavanWeb ? 'hover:bg-[#728890]/40' : 'hover:bg-slate-100'} text-[#800040] text-base font-medium transition"><i class="fa-solid fa-cloud-sun text-[#800040] w-5 text-center"></i> <span>Dashboard Meteo</span></a>
                                <a href="archivio.html" class="flex items-center gap-3 px-3 py-2 rounded-lg ${isCavanWeb ? 'hover:bg-[#728890]/40' : 'hover:bg-slate-100'} text-[#800040] text-base font-medium transition"><i class="fa-solid fa-calendar-days text-[#800040] w-5 text-center"></i> <span>Archivio Storico</span></a>
                                <a href="https://cavannastefano-sudo.github.io/OrologioSolare/index.html" target="_blank" class="flex items-center gap-3 px-3 py-2 rounded-lg ${isCavanWeb ? 'hover:bg-[#728890]/40' : 'hover:bg-slate-100'} text-[#800040] text-base font-medium transition"><i class="fa-solid fa-clock text-[#800040] w-5 text-center"></i> <span>SunClock24</span></a>
                                <a href="https://www.blog.cavanweb.com/p/blog-page_31.html" target="_blank" class="flex items-center gap-3 px-3 py-2 rounded-lg ${isCavanWeb ? 'hover:bg-[#728890]/40' : 'hover:bg-slate-100'} text-[#800040] text-base font-medium transition"><i class="fa-solid fa-globe text-[#800040] w-5 text-center"></i> <span>Meteo Europa</span></a>
                            </div>
                        </div>
                    </div>
                    <div class="text-center border-t border-slate-300/40 pt-3">
                        <h1 class="text-xl sm:text-3xl font-bold tracking-tight text-slate-900 mb-0.5 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-earth-americas ${isCavanWeb ? 'text-[#800040]' : 'text-amber-500'}"></i> Mappa Interattiva
                        </h1>
                        <p class="text-slate-600 text-sm sm:text-base">Seleziona una località sulla mappa</p>
                    </div>
                `;

                mainContainer.className = "w-full max-w-6xl mx-auto space-y-4 flex-grow";
                mainContainer.innerHTML = `
                    <div class="flex flex-wrap items-center gap-3">
                        <div class="flex items-center gap-2 text-slate-900 font-semibold text-base">
                            <i class="fa-solid fa-earth-americas"></i> Località:
                        </div>
                        <div class="relative flex-grow max-w-xs">
                            <input type="text" id="search-input" placeholder="Cerca città..." class="w-full pl-3 pr-3 py-2 ${isCavanWeb ? 'bg-[#8FBBD0] text-[#800040] placeholder-[#800040]/70 border-[#800040]/50 font-bold' : 'bg-white text-slate-800 placeholder-slate-400 border-slate-300'} border rounded focus:outline-none text-base">
                        </div>
                        <button onclick="handleSearch()" class="bg-[#0284c7] hover:bg-[#0369a1] px-4 py-2 rounded text-white font-semibold text-base flex items-center gap-1.5 shadow-sm transition"><i class="fa-solid fa-magnifying-glass"></i> Cerca</button>
                    </div>

                    <div class="${cardBgClass} border rounded p-6 shadow-sm space-y-4">
                        <div id="map"></div>
                        <div class="text-center text-sm text-slate-700 font-medium">Clicca un punto qualsiasi sulla mappa o cerca una città per selezionarla.</div>
                    </div>
                `;
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdown-menu');
            const menuBtn = document.getElementById('menu-btn');
            if (menu && menuBtn && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        function initMap() {
            const savedLat = parseFloat(localStorage.getItem('cavanweb_active_lat')) || 45.0483;
            const savedLon = parseFloat(localStorage.getItem('cavanweb_active_lon')) || 9.6953;
            const savedName = localStorage.getItem('cavanweb_active_name') || 'Piacenza';

            currentLat = savedLat;
            currentLon = savedLon;
            currentPlaceName = savedName;

            const input = document.getElementById('search-input');
            if (input) input.value = currentPlaceName;

            if (map) {
                map.remove();
                map = null;
            }

            map = L.map('map').setView([currentLat, currentLon], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            marker = L.marker([currentLat, currentLon], {draggable: true}).addTo(map);
            marker.bindPopup(`<b>${currentPlaceName}</b><br>Lat: ${currentLat.toFixed(4)}, Lon: ${currentLon.toFixed(4)}`).openPopup();

            marker.on('dragend', function(event) {
                const position = marker.getLatLng();
                currentLat = position.lat;
                currentLon = position.lng;
                reverseGeocode(currentLat, currentLon);
            });

            map.on('click', function(e) {
                currentLat = e.latlng.lat;
                currentLon = e.latlng.lng;
                marker.setLatLng([currentLat, currentLon]);
                reverseGeocode(currentLat, currentLon);
            });
        }

        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=it`);
                const data = await res.json();
                if (data && data.address) {
                    currentPlaceName = data.address.city || data.address.town || data.address.village || data.address.county || "Località selezionata";
                } else {
                    currentPlaceName = "Località selezionata";
                }
                const input = document.getElementById('search-input');
                if (input) input.value = currentPlaceName;

                marker.bindPopup(`<b>${currentPlaceName}</b><br>Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`).openPopup();

                localStorage.setItem('cavanweb_active_lat', currentLat);
                localStorage.setItem('cavanweb_active_lon', currentLon);
                localStorage.setItem('cavanweb_active_name', currentPlaceName);
            } catch (err) {
                console.error(err);
            }
        }

        async function handleSearch() {
            const input = document.getElementById('search-input');
            if (!input || !input.value.trim()) {
                alert("Inserisci il nome di una località.");
                return;
            }
            const query = input.value.trim();
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&accept-language=it`);
                const data = await res.json();
                if (data && data.length > 0) {
                    currentLat = parseFloat(data[0].lat);
                    currentLon = parseFloat(data[0].lon);
                    currentPlaceName = data[0].display_name.split(',')[0];

                    map.setView([currentLat, currentLon], 13);
                    marker.setLatLng([currentLat, currentLon]);
                    marker.bindPopup(`<b>${currentPlaceName}</b><br>Lat: ${currentLat.toFixed(4)}, Lon: ${currentLon.toFixed(4)}`).openPopup();

                    localStorage.setItem('cavanweb_active_lat', currentLat);
                    localStorage.setItem('cavanweb_active_lon', currentLon);
                    localStorage.setItem('cavanweb_active_name', currentPlaceName);
                } else {
                    alert("Località non trovata.");
                }
            } catch (err) {
                console.error(err);
                alert("Errore di connessione durante la ricerca.");
            }
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            setTheme(savedTheme);
        };
    </script>
</body>
</html>
