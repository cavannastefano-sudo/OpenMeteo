<!DOCTYPE html>
<html lang="it" data-theme="cavanweb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoCWEB - Mappa Meteo Interattiva</title>
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#728890" id="meta-theme-color">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }
        #map {
            width: 100vw;
            height: calc(100vh - 140px);
            z-index: 1;
        }
        /* Custom Leaflet Controls Styling for Dark/Light/CavanWeb */
        .leaflet-control-layers {
            border-radius: 1rem !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3) !important;
            padding: 6px 10px !important;
            font-family: 'Inter', sans-serif !important;
        }
    </style>
</head>
<body class="bg-[#728890] min-h-screen text-slate-800 flex flex-col justify-between" id="app-body">

    <!-- HEADER FLUIDO FULL-WIDTH -->
    <header id="app-header" class="w-full px-4 py-3 flex items-center justify-between shadow-md z-20 transition-colors">
        <div class="flex items-center gap-3">
            <a href="openwmap2.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition shadow" id="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">Torna al Meteo</span>
            </a>
        </div>
        <div class="text-center flex-grow mx-2">
            <h1 class="text-base sm:text-xl font-bold tracking-tight flex items-center justify-center gap-2">
                <i class="fa-solid fa-earth-americas text-amber-400"></i> <span id="header-title-text">Mappa Meteo Interattiva</span>
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" id="theme-toggle-btn" title="Cambia Tema" class="px-3.5 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-palette" id="theme-icon"></i> <span class="hidden sm:inline" id="theme-label">Tema</span>
            </button>
        </div>
    </header>

    <!-- MAP CONTAINER FULL SCREEN -->
    <main class="w-full relative flex-grow">
        <div id="map"></div>
    </main>

    <!-- FOOTER SOTTILE -->
    <footer id="app-footer" class="w-full py-2 text-center text-xs z-20 transition-colors">
        <p id="footer-text"><i class="fa-solid fa-location-dot text-amber-400 mr-1"></i> Clicca ovunque sulla mappa per scoprire il meteo della località</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const API_KEY = "bd940445d9a0cc5d54dc2b7b498ba441";
        let map = null;
        let marker = null;
        let currentLat = 45.0483;
        let currentLon = 9.6953;
        let currentPlaceName = "Piacenza";

        function toggleTheme() {
            const current = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            let next = 'light';
            if (current === 'cavanweb') next = 'light';
            else if (current === 'light') next = 'dark';
            else next = 'cavanweb';
            setTheme(next);
        }

        function setTheme(themeName) {
            localStorage.setItem('cavanweb_theme', themeName);
            const body = document.getElementById('app-body');
            const metaTheme = document.getElementById('meta-theme-color');
            const header = document.getElementById('app-header');
            const footer = document.getElementById('app-footer');
            const backBtn = document.getElementById('back-btn');
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            const themeIcon = document.getElementById('theme-icon');
            const themeLabel = document.getElementById('theme-label');

            if (themeName === 'dark') {
                body.className = "bg-slate-950 min-h-screen text-white flex flex-col justify-between";
                metaTheme.setAttribute("content", "#020617");
                header.className = "w-full px-4 py-3 flex items-center justify-between shadow-md z-20 bg-slate-900/90 backdrop-blur-md border-b border-white/10 text-white";
                footer.className = "w-full py-2 text-center text-xs z-20 bg-slate-900/90 text-blue-200/80 border-t border-white/10";
                backBtn.className = "inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition shadow bg-white/10 hover:bg-white/20 text-blue-200 hover:text-white border border-white/20";
                themeToggleBtn.className = "px-3.5 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center gap-1.5 bg-white/10 hover:bg-white/25 text-amber-400 border border-white/20";
                themeIcon.className = "fa-solid fa-moon";
                themeLabel.textContent = "Scuro";
            } else if (themeName === 'light') {
                body.className = "bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#f1f5f9");
                header.className = "w-full px-4 py-3 flex items-center justify-between shadow-md z-20 bg-white border-b border-slate-200 text-slate-800";
                footer.className = "w-full py-2 text-center text-xs z-20 bg-white text-slate-600 border-t border-slate-200";
                backBtn.className = "inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition shadow bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-300";
                themeToggleBtn.className = "px-3.5 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-white border border-amber-600";
                themeIcon.className = "fa-solid fa-sun";
                themeLabel.textContent = "Chiaro";
            } else {
                // Tema CavanWeb (#728890 con header coordinato)
                body.className = "bg-[#728890] min-h-screen text-slate-900 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#728890");
                header.className = "w-full px-4 py-3 flex items-center justify-between shadow-md z-20 bg-[#D8D9D0] border-b border-slate-400 text-slate-900";
                footer.className = "w-full py-2 text-center text-xs z-20 bg-[#D8D9D0] text-slate-900 border-t border-slate-400 font-semibold";
                backBtn.className = "inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition shadow bg-[#728890] hover:bg-[#5d727a] text-white border border-slate-600/40";
                themeToggleBtn.className = "px-3.5 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center gap-1.5 bg-[#728890] hover:bg-[#5d727a] text-white border border-slate-600/40";
                themeIcon.className = "fa-solid fa-desktop";
                themeLabel.textContent = "CavanWeb";
            }

            if (!map) {
                initMap();
            }
        }

        function initMap() {
            const savedLat = parseFloat(localStorage.getItem('cavanweb_active_lat')) || 45.0483;
            const savedLon = parseFloat(localStorage.getItem('cavanweb_active_lon')) || 9.6953;
            const savedName = localStorage.getItem('cavanweb_active_name') || 'Piacenza';

            currentLat = savedLat;
            currentLon = savedLon;
            currentPlaceName = savedName;

            // Base Layers
            const esriDark = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16,
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
            });

            const esriLight = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16,
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
            });

            const openTopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                maxZoom: 17,
                attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
            });

            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            });

            // Weather Overlay Layers (OpenWeatherMap)
            const tempLayer = L.tileLayer(`https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                maxZoom: 19,
                attribution: 'Weather data &copy; OpenWeatherMap',
                opacity: 0.6
            });

            const precipLayer = L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                maxZoom: 19,
                attribution: 'Weather data &copy; OpenWeatherMap',
                opacity: 0.6
            });

            const windLayer = L.tileLayer(`https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                maxZoom: 19,
                attribution: 'Weather data &copy; OpenWeatherMap',
                opacity: 0.6
            });

            const pressureLayer = L.tileLayer(`https://tile.openweathermap.org/map/pressure_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                maxZoom: 19,
                attribution: 'Weather data &copy; OpenWeatherMap',
                opacity: 0.6
            });

            const cloudsLayer = L.tileLayer(`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                maxZoom: 19,
                attribution: 'Weather data &copy; OpenWeatherMap',
                opacity: 0.6
            });

            map = L.map('map', {
                center: [currentLat, currentLon],
                zoom: 7,
                layers: [openTopoMap]
            });

            const baseMaps = {
                "Esri Dark (Scura)": esriDark,
                "Esri Light (Chiara)": esriLight,
                "OpenTopoMap": openTopoMap,
                "OpenStreetMap": osm
            };

            const overlayMaps = {
                "Temperature": tempLayer,
                "Precipitazioni (Pioggia)": precipLayer,
                "Vento": windLayer,
                "Pressione Atmosferica": pressureLayer,
                "Copertura Nuvolosa": cloudsLayer
            };

            L.control.layers(baseMaps, overlayMaps, {position: 'topright'}).addTo(map);

            marker = L.marker([currentLat, currentLon], {draggable: true}).addTo(map);
            marker.bindPopup(`<b>${currentPlaceName}</b><br>Lat: ${currentLat.toFixed(4)}, Lon: ${currentLon.toFixed(4)}`).openPopup();

            marker.on('dragend', function(event) {
                const position = marker.getLatLng();
                currentLat = position.lat;
                currentLon = position.lng;
                reverseGeocode(currentLat, currentLon);
            });

            map.on('click', function(e) {
                currentLat = e.latlng.lat;
                currentLon = e.latlng.lng;
                marker.setLatLng([currentLat, currentLon]);
                reverseGeocode(currentLat, currentLon);
            });
        }

        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=it`);
                const data = await res.json();
                if (data && data.address) {
                    currentPlaceName = data.address.city || data.address.town || data.address.village || data.address.county || "Località selezionata";
                } else {
                    currentPlaceName = "Località selezionata";
                }

                marker.bindPopup(`<b>${currentPlaceName}</b><br>Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`).openPopup();

                localStorage.setItem('cavanweb_active_lat', currentLat);
                localStorage.setItem('cavanweb_active_lon', currentLon);
                localStorage.setItem('cavanweb_active_name', currentPlaceName);
            } catch (err) {
                console.error(err);
            }
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            setTheme(savedTheme);
        };
    </script>
</body>
</html>
