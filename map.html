<!DOCTYPE html>
<html lang="it" data-theme="cavanweb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Meteo Mondiale</title>
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#728890" id="meta-theme-color">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS (Mappa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; transition: background 0.3s ease, color 0.3s ease; }
        #map { height: calc(100vh - 130px); width: 100vw; border-radius: 0; }
        
        /* Personalizzazione popup mappa dinamica */
        .leaflet-popup-content-wrapper { border-radius: 1rem; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Stile personalizzato per il controllo dei layer */
        .leaflet-control-layers { border-radius: 1rem !important; padding: 8px 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); max-height: 80vh; overflow-y: auto; font-family: 'Inter', sans-serif !important; }
        .leaflet-control-layers label { font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    </style>
</head>
<body class="bg-[#728890] min-h-screen text-slate-900 flex flex-col justify-between" id="app-body">

    <!-- Header Full Width Dinamico -->
    <header id="app-header" class="w-full bg-[#D8D9D0] border-b border-slate-400 px-3 py-2.5 flex items-center justify-between z-[1000] transition-colors gap-2">
        <a href="openwmap2.html" id="back-btn" class="bg-[#728890] hover:bg-[#5d727a] px-2.5 py-1.5 rounded-xl border border-slate-600/40 shadow transition text-white flex items-center gap-1.5 text-xs font-semibold flex-shrink-0">
            <i class="fa-solid fa-arrow-left text-amber-400"></i>
            <span>Indietro</span>
        </a>
        <div class="text-center flex-grow mx-1 overflow-hidden">
            <h1 id="main-title" class="text-xs sm:text-sm md:text-base font-bold tracking-tight flex items-center justify-center gap-1.5 text-slate-900 truncate">
                <i class="fa-solid fa-earth-americas text-[#800040] flex-shrink-0" id="title-icon"></i> <span class="truncate">Mappa Meteo</span>
            </h1>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
            <!-- Pulsante Cambio Tema -->
            <button onclick="toggleTheme()" id="theme-toggle-btn" title="Cambia Tema" class="bg-[#728890] hover:bg-[#5d727a] text-white px-2.5 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1 border border-slate-600/40">
                <i class="fa-solid fa-desktop" id="theme-icon"></i> <span id="theme-label" class="hidden sm:inline">CavanWeb</span>
            </button>
            
            <!-- Pulsante Menu a tendina -->
            <div class="relative flex-shrink-0">
                <button onclick="toggleMenu()" id="menu-btn" title="Menu" class="bg-[#728890] hover:bg-[#5d727a] text-white w-9 h-9 rounded-xl border border-slate-600/40 shadow transition flex items-center justify-center text-sm font-semibold">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-60 bg-slate-900/95 border border-white/20 text-blue-200 backdrop-blur-xl border rounded-2xl shadow-2xl py-2 z-[1100] flex flex-col gap-1 px-2">
                    <div class="px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-amber-400 border-b border-white/20 flex items-center gap-1.5" id="menu-fav-title"><i class="fa-solid fa-star"></i> Preferiti</div>
                    <div id="favorites-list" class="flex flex-col gap-1 max-h-40 overflow-y-auto py-1"><span class="text-xs opacity-70 px-3 py-1 italic">Nessun preferito salvato</span></div>
                    <div class="border-t border-white/20 my-1" id="menu-divider"></div>
                    <a href="map.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 text-sm font-semibold transition"><i class="fa-solid fa-earth-americas menu-icon w-5 text-center"></i> <span>Mappa Interattiva</span></a>
                    <a href="https://cavannastefano-sudo.github.io/OrologioSolare/index.html" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 text-sm font-semibold transition"><i class="fa-solid fa-clock menu-icon w-5 text-center"></i> <span>SunClock24</span></a>
                    <a href="https://www.blog.cavanweb.com/p/blog-page_31.html" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 text-sm font-semibold transition"><i class="fa-solid fa-globe menu-icon w-5 text-center"></i> <span>Meteo Europa</span></a>
                    <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 text-sm font-semibold transition"><i class="fa-solid fa-calendar-days menu-icon w-5 text-center"></i> <span>Archivio Storico</span></a>
                    <a href="https://cavannastefano-sudo.github.io/lista.m3u/" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 text-sm font-semibold transition"><i class="fa-solid fa-tv menu-icon w-5 text-center"></i> <span>myIPTV</span></a>
                </div>
            </div>

            <!-- Logo CavanWeb -->
            <a href="https://www.cavanweb.com/" target="_blank" class="flex items-center group" title="Visita CavanWeb">
                <img src="SfondoN-512.png" alt="Logo" class="w-8 h-8 rounded-xl object-cover border-0 shadow group-hover:scale-105 transition">
            </a>
        </div>
    </header>

    <!-- Main Map Container Full Width -->
    <main class="w-full flex-grow relative">
        <div id="map"></div>
        <!-- Istruzione fluttuante in basso -->
        <div id="map-banner" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-[#D8D9D0] backdrop-blur-md px-4 py-2 rounded-full border border-slate-400 text-xs sm:text-sm text-slate-900 font-semibold pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap transition-colors">
            📍 Clicca ovunque sulla mappa per scoprire il meteo della località
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_KEY = "bd940445d9a0cc5d54dc2b7b498ba441";

        // Definizione dei Layer di base
        const darkLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Esri, HERE, Garmin, © OpenStreetMap contributors'
        });

        const lightLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Esri, HERE, Garmin, © OpenStreetMap contributors'
        });

        const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)'
        });

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });

        // Layer delle Situazioni Meteorologiche di OpenWeatherMap con Opacità Massima (1.0)
        const tempLayer = L.tileLayer(`https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const precipLayer = L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const windLayer = L.tileLayer(`https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const pressureLayer = L.tileLayer(`https://tile.openweathermap.org/map/pressure_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const cloudsLayer = L.tileLayer(`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        // Recupera la scelta precedente della mappa di base (default: dark)
        const savedLayerType = localStorage.getItem('preferred_map_layer') || 'dark';
        let defaultLayer = darkLayer;
        if (savedLayerType === 'light') defaultLayer = lightLayer;
        if (savedLayerType === 'topo') defaultLayer = topoLayer;
        if (savedLayerType === 'osm') defaultLayer = osmLayer;

        // Inizializzazione Mappa centrata sull'Europa/Italia
        const map = L.map('map', {
            center: [45.0483, 9.6953],
            zoom: 5,
            layers: [defaultLayer]
        });

        // Mappe di base
        const baseMaps = {
            "🌙 Esri Dark (Scura)": darkLayer,
            "☀️ Esri Light (Chiara)": lightLayer,
            "⛰️ OpenTopoMap": topoLayer,
            "🗺️ OpenStreetMap": osmLayer
        };

        // Livelli sovrapponibili con checkbox
        const overlayMaps = {
            "🌡️ Temperature": tempLayer,
            "🌧️ Precipitazioni (Pioggia)": precipLayer,
            "💨 Vento": windLayer,
            "⏱️ Pressione Atmosferica": pressureLayer,
            "☁️ Copertura Nuvolosa": cloudsLayer
        };

        // Aggiunge il selettore in alto a destra
        L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

        // Salva la preferenza della mappa di base scelta dall'utente
        map.on('baselayerchange', function (e) {
            if (e.name.includes("Dark")) {
                localStorage.setItem('preferred_map_layer', 'dark');
            } else if (e.name.includes("Light")) {
                localStorage.setItem('preferred_map_layer', 'light');
            } else if (e.name.includes("Topo")) {
                localStorage.setItem('preferred_map_layer', 'topo');
            } else {
                localStorage.setItem('preferred_map_layer', 'osm');
            }
        });

        let currentMarker = null;

        // Gestione Menu a tendina
        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdown-menu');
            const menuBtn = document.getElementById('menu-btn');
            if (menu && menuBtn && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        function getFavorites() {
            try { return JSON.parse(localStorage.getItem('cavanweb_favorites')) || []; } catch (e) { return []; }
        }

        function renderFavoritesMenu() {
            const favListContainer = document.getElementById('favorites-list');
            if (!favListContainer) return;
            const favorites = getFavorites();
            const currentTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            const textClass = currentTheme === 'light' ? 'text-[#808000]' : '';

            if (favorites.length === 0) {
                favListContainer.innerHTML = `<span class="text-xs opacity-70 px-3 py-1 italic ${textClass}">Nessun preferito salvato</span>`;
                return;
            }

            let html = '';
            favorites.forEach(city => {
                html += `<a href="openwmap2.html" onclick="localStorage.setItem('selected_city', '${city}'); localStorage.setItem('cavanweb_active_name', '${city}');" class="w-full text-left flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-black/5 text-base font-semibold transition ${textClass}">
                    <span class="truncate"><i class="fa-solid fa-location-dot mr-2 text-xs"></i>${city}</span>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
                </a>`;
            });
            favListContainer.innerHTML = html;
        }

        // Gestione dei Temi in ciclo sequenziale
        function toggleTheme() {
            const current = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            let next = 'light';
            if (current === 'cavanweb') next = 'light';
            else if (current === 'light') next = 'dark';
            else if (current === 'dark') next = 'green';
            else if (current === 'green') next = 'lavender';
            else next = 'cavanweb';
            setTheme(next);
        }

        function setTheme(themeName) {
            localStorage.setItem('cavanweb_theme', themeName);
            const body = document.getElementById('app-body');
            const metaTheme = document.getElementById('meta-theme-color');
            const header = document.getElementById('app-header');
            const mainTitle = document.getElementById('main-title');
            const titleIcon = document.getElementById('title-icon');
            const backBtn = document.getElementById('back-btn');
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            const themeIcon = document.getElementById('theme-icon');
            const themeLabel = document.getElementById('theme-label');
            const menuBtn = document.getElementById('menu-btn');
            const dropdownMenu = document.getElementById('dropdown-menu');
            const menuFavTitle = document.getElementById('menu-fav-title');
            const menuDivider = document.getElementById('menu-divider');
            const mapBanner = document.getElementById('map-banner');

            const styleSheets = document.getElementById('dynamic-theme-styles') || document.createElement('style');
            styleSheets.id = 'dynamic-theme-styles';

            body.style.backgroundColor = '';
            body.style.color = '';
            header.style.backgroundColor = '';
            header.style.borderBottom = '';
            backBtn.style.backgroundColor = '';
            backBtn.style.color = '';
            backBtn.style.border = '';
            themeToggleBtn.style.backgroundColor = '';
            themeToggleBtn.style.color = '';
            themeToggleBtn.style.border = '';
            menuBtn.style.backgroundColor = '';
            menuBtn.style.color = '';
            menuBtn.style.border = '';
            dropdownMenu.className = "hidden absolute right-0 mt-2 w-60 border rounded-2xl shadow-2xl py-2 z-[1100] flex flex-col gap-1 px-2";
            mapBanner.style.backgroundColor = '';
            mapBanner.style.color = '';
            mapBanner.style.border = '';

            // Aggiorna colore icone menu in base al tema
            const menuIcons = document.querySelectorAll('.menu-icon');
            menuIcons.forEach(icon => {
                icon.className = icon.className.replace(/text-(amber-400|\[#808000\]|current)/g, '');
                if (themeName === 'dark' || themeName === 'green') {
                    icon.classList.add('text-amber-400');
                } else if (themeName === 'light') {
                    icon.classList.add('text-[#808000]');
                } else {
                    icon.classList.add('text-current');
                }
            });

            if (themeName === 'dark') {
                body.className = "bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 min-h-screen text-emerald-300 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#0f172a");
                header.className = "w-full bg-slate-900/85 backdrop-blur-md border-b border-white/10 px-3 py-2.5 flex items-center justify-between z-[1000] text-emerald-300 transition-colors gap-2";
                mainTitle.className = "text-xs sm:text-sm md:text-base font-bold tracking-tight flex items-center justify-center gap-1.5 text-white truncate";
                titleIcon.className = "fa-solid fa-earth-americas text-amber-400 flex-shrink-0";
                backBtn.className = "bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-xl border border-white/20 shadow transition text-emerald-300 hover:text-white flex items-center gap-1.5 text-xs font-semibold flex-shrink-0";
                themeToggleBtn.className = "bg-white/10 hover:bg-white/25 text-amber-400 px-2.5 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1 border border-white/20 flex-shrink-0";
                menuBtn.className = "bg-white/10 hover:bg-white/25 text-amber-400 w-9 h-9 rounded-xl border border-white/20 shadow transition flex items-center justify-center text-sm font-semibold flex-shrink-0";
                themeIcon.className = "fa-solid fa-moon";
                themeLabel.textContent = "Scuro";
                dropdownMenu.className += " bg-slate-900/95 border-white/20 text-emerald-200 backdrop-blur-xl";
                menuFavTitle.className = "px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-amber-400 border-b border-white/20 flex items-center gap-1.5";
                menuDivider.className = "border-t border-white/20 my-1";
                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 text-xs sm:text-sm text-emerald-300 pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap transition-colors";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #0f172a !important; color: #34d399 !important; border: 1px solid rgba(255,255,255,0.2) !important; font-weight: bold; }
                    .leaflet-popup-tip { background: #0f172a !important; }
                    .leaflet-control-layers { background: #0f172a !important; color: #34d399 !important; border: 1px solid rgba(255,255,255,0.2) !important; font-weight: bold; }
                    .leaflet-control-layers-separator { border-top: 1px solid rgba(255,255,255,0.2) !important; }
                `;
            } else if (themeName === 'green') {
                body.className = "bg-gradient-to-br from-emerald-900 via-teal-900 to-slate-900 min-h-screen text-sky-200 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#064e3b");
                header.className = "w-full bg-emerald-950/85 backdrop-blur-md border-b border-emerald-500/20 px-3 py-2.5 flex items-center justify-between z-[1000] text-sky-200 transition-colors gap-2";
                mainTitle.className = "text-xs sm:text-sm md:text-base font-bold tracking-tight flex items-center justify-center gap-1.5 text-white truncate";
                titleIcon.className = "fa-solid fa-earth-americas text-amber-400 flex-shrink-0";
                backBtn.className = "bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-xl border border-white/20 shadow transition text-sky-200 hover:text-white flex items-center gap-1.5 text-xs font-semibold flex-shrink-0";
                themeToggleBtn.className = "bg-white/10 hover:bg-white/25 text-amber-400 px-2.5 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1 border border-white/20 flex-shrink-0";
                menuBtn.className = "bg-white/10 hover:bg-white/25 text-amber-400 w-9 h-9 rounded-xl border border-white/20 shadow transition flex items-center justify-center text-sm font-semibold flex-shrink-0";
                themeIcon.className = "fa-solid fa-leaf";
                themeLabel.textContent = "Verde";
                dropdownMenu.className += " bg-teal-950/95 border-emerald-500/20 text-sky-200 backdrop-blur-xl";
                menuFavTitle.className = "px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-amber-400 border-b border-emerald-500/20 flex items-center gap-1.5";
                menuDivider.className = "border-t border-emerald-500/20 my-1";
                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-emerald-950/90 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 text-xs sm:text-sm text-sky-200 pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap transition-colors";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #064e3b !important; color: #38bdf8 !important; border: 1px solid rgba(255,255,255,0.2) !important; font-weight: bold; }
                    .leaflet-popup-tip { background: #064e3b !important; }
                    .leaflet-control-layers { background: #064e3b !important; color: #38bdf8 !important; border: 1px solid rgba(255,255,255,0.2) !important; font-weight: bold; }
                    .leaflet-control-layers-separator { border-top: 1px solid rgba(255,255,255,0.2) !important; }
                `;
            } else if (themeName === 'light') {
                body.className = "bg-white min-h-screen text-slate-800 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#ffffff");
                
                header.className = "w-full px-3 py-2.5 flex items-center justify-between z-[1000] text-slate-800 shadow-sm transition-colors gap-2";
                header.style.backgroundColor = "#fffde7";
                header.style.borderBottom = "1px solid #fde047";

                mainTitle.className = "text-xs sm:text-sm md:text-base font-bold tracking-tight flex items-center justify-center gap-1.5 text-slate-900 truncate";
                titleIcon.className = "fa-solid fa-earth-americas text-amber-600 flex-shrink-0";
                
                backBtn.className = "px-2.5 py-1.5 rounded-xl border shadow transition text-slate-800 flex items-center gap-1.5 text-xs font-semibold flex-shrink-0";
                backBtn.style.backgroundColor = "#fef08a";
                backBtn.style.borderColor = "#facc15";

                themeToggleBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1 border flex-shrink-0";
                themeToggleBtn.style.backgroundColor = "#fef08a";
                themeToggleBtn.style.color = "#854d0e";
                themeToggleBtn.style.borderColor = "#facc15";

                menuBtn.className = "w-9 h-9 rounded-xl border shadow transition flex items-center justify-center text-sm font-semibold flex-shrink-0";
                menuBtn.style.backgroundColor = "#fef08a";
                menuBtn.style.color = "#854d0e";
                menuBtn.style.borderColor = "#facc15";

                dropdownMenu.className += " bg-[#fffacd] border-amber-300 text-[#808000] backdrop-blur-none";
                menuFavTitle.className = "px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-[#808000] border-b border-amber-300 flex items-center gap-1.5";
                menuDivider.className = "border-t border-amber-300 my-1";

                // Applica il colore verde oliva anche ai link del menu a tendina
                const menuLinks = dropdownMenu.querySelectorAll('a');
                menuLinks.forEach(link => {
                    link.classList.add('text-[#808000]');
                });

                themeIcon.className = "fa-solid fa-sun";
                themeLabel.textContent = "Chiaro";

                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 backdrop-blur-md px-4 py-2 rounded-full text-xs sm:text-sm text-slate-800 font-semibold pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap transition-colors";
                mapBanner.style.backgroundColor = "#fffde7";
                mapBanner.style.border = "1px solid #fde047";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #fffde7 !important; color: #1e293b !important; border: 1px solid #fde047 !important; font-weight: bold; }
                    .leaflet-popup-tip { background: #fffde7 !important; }
                    .leaflet-control-layers { background: #fffde7 !important; color: #1e293b !important; border: 1px solid #fde047 !important; font-weight: bold; }
                    .leaflet-control-layers-separator { border-top: 1px solid #fde047 !important; }
                `;
            } else if (themeName === 'lavender') {
                body.style.backgroundColor = "#9D93AB";
                body.style.color = "#3C2A4D";
                metaTheme.setAttribute("content", "#9D93AB");
                
                header.className = "w-full px-3 py-2.5 flex items-center justify-between z-[1000] shadow-sm transition-colors gap-2";
                header.style.backgroundColor = "#DAD0F0";
                header.style.borderBottom = "1px solid rgba(92, 59, 92, 0.25)";

                mainTitle.className = "text-xs sm:text-sm md:text-base font-bold tracking-tight flex items-center justify-center gap-1.5 truncate";
                mainTitle.style.color = "#5C3B5C";
                titleIcon.className = "fa-solid fa-earth-americas text-[#5C3B5C] flex-shrink-0";
                
                backBtn.className = "px-2.5 py-1.5 rounded-xl shadow transition flex items-center gap-1.5 text-xs font-semibold flex-shrink-0";
                backBtn.style.backgroundColor = "#F5F2EB";
                backBtn.style.color = "#5C3B5C";
                backBtn.style.border = "1px solid rgba(92, 59, 92, 0.3)";

                themeToggleBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1 flex-shrink-0";
                themeToggleBtn.style.backgroundColor = "#F5F2EB";
                themeToggleBtn.style.color = "#5C3B5C";
                themeToggleBtn.style.border = "1px solid rgba(92, 59, 92, 0.3)";

                menuBtn.className = "w-9 h-9 rounded-xl shadow transition flex items-center justify-center text-sm font-semibold flex-shrink-0";
                menuBtn.style.backgroundColor = "#F5F2EB";
                menuBtn.style.color = "#5C3B5C";
                menuBtn.style.border = "1px solid rgba(92, 59, 92, 0.3)";

                dropdownMenu.className += " border-[#5C3B5C]/30 text-[#5C3B5C] backdrop-blur-none";
                dropdownMenu.style.backgroundColor = "#F8FED7";
                menuFavTitle.className = "px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-[#5C3B5C] border-b border-[#5C3B5C]/30 flex items-center gap-1.5";
                menuDivider.className = "border-t border-[#5C3B5C]/30 my-1";

                themeIcon.className = "fa-solid fa-spa";
                themeLabel.textContent = "Lilla";

                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 backdrop-blur-md px-4 py-2 rounded-full text-xs sm:text-sm font-semibold pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap transition-colors";
                mapBanner.style.backgroundColor = "#F8FED7";
                mapBanner.style.color = "#5C3B5C";
                mapBanner.style.border = "1px solid rgba(92, 59, 92, 0.3)";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #F8FED7 !important; color: #5C3B5C !important; border: 1px solid rgba(92, 59, 92, 0.3) !important; font-weight: bold; }
                    .leaflet-popup-tip { background: #F8FED7 !important; }
                    .leaflet-control-layers { background: #F8FED7 !important; color: #5C3B5C !important; border: 1px solid rgba(92, 59, 92, 0.3) !important; font-weight: bold; }
                    .leaflet-control-layers-separator { border-top: 1px solid rgba(92, 59, 92, 0.3) !important; }
                `;
            } else {
                // CavanWeb
                body.className = "bg-[#728890] min-h-screen text-slate-900 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#728890");
                header.className = "w-full bg-[#D8D9D0] border-b border-slate-400 px-3 py-2.5 flex items-center justify-between z-[1000] text-slate-900 shadow-sm transition-colors gap-2";
                mainTitle.className = "text-xs sm:text-sm md:text-base font-bold tracking-tight flex items-center justify-center gap-1.5 text-slate-900 truncate";
                titleIcon.className = "fa-solid fa-earth-americas text-[#800040] flex-shrink-0";
                backBtn.className = "bg-[#728890] hover:bg-[#5d727a] px-2.5 py-1.5 rounded-xl border border-slate-600/40 shadow transition text-white flex items-center gap-1.5 text-xs font-semibold flex-shrink-0";
                themeToggleBtn.className = "bg-[#728890] hover:bg-[#5d727a] text-white px-2.5 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1 border border-slate-600/40 flex-shrink-0";
                menuBtn.className = "bg-[#800040] text-white hover:bg-[#600030] w-9 h-9 rounded-xl border border-[#800040]/50 shadow transition flex items-center justify-center text-sm font-semibold flex-shrink-0";
                themeIcon.className = "fa-solid fa-desktop";
                themeLabel.textContent = "CavanWeb";
                dropdownMenu.className += " bg-[#8FBBD0] border-[#800040]/50 text-[#800040] backdrop-blur-none";
                menuFavTitle.className = "px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-[#800040] border-b border-[#800040]/30 flex items-center gap-1.5";
                menuDivider.className = "border-t border-[#800040]/30 my-1";
                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-[#D8D9D0] backdrop-blur-md px-4 py-2 rounded-full border border-slate-400 text-xs sm:text-sm text-slate-900 font-semibold pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap transition-colors";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #8FBBD0 !important; color: #800040 !important; border: 1px solid rgba(128,0,64,0.3) !important; font-weight: bold; }
                    .leaflet-popup-tip { background: #8FBBD0 !important; }
                    .leaflet-control-layers { background: #8FBBD0 !important; color: #800040 !important; border: 1px solid rgba(128,0,64,0.3) !important; font-weight: bold; }
                    .leaflet-control-layers-separator { border-top: 1px solid rgba(128,0,64,0.3) !important; }
                `;
            }
            if (!document.getElementById('dynamic-theme-styles')) {
                document.head.appendChild(styleSheets);
            }
            renderFavoritesMenu();
        }

        // Funzione per caricare il meteo al click sulla mappa e memorizzare correttamente la città
        async function getWeatherByCoords(lat, lon) {
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=it`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Dati non disponibili");
                const data = await response.json();

                const cityName = data.name || "Località sconosciuta";
                const country = data.sys.country || "";
                const temp = Number(data.main.temp).toFixed(1);
                const feelsLike = Number(data.main.feels_like).toFixed(1);
                const desc = data.weather[0].description;
                const humidity = data.main.humidity;
                const wind = Number(data.wind.speed * 3.6).toFixed(1);

                const popupContent = `
                    <div class="p-2 space-y-1 text-left">
                        <h3 class="font-bold text-base">${cityName} (${country})</h3>
                        <p class="text-2xl font-extrabold">${temp}°C <span class="text-xs font-normal opacity-75">(Percepita ${feelsLike}°C)</span></p>
                        <p class="capitalize text-sm opacity-90">${desc}</p>
                        <hr class="border-current opacity-20 my-1">
                        <div class="text-xs space-y-0.5 opacity-90">
                            <p><i class="fa-solid fa-droplet text-blue-400"></i> Umidità: ${humidity}%</p>
                            <p><i class="fa-solid fa-wind text-teal-400"></i> Vento: ${wind} km/h</p>
                        </div>
                        <div class="pt-2 text-center">
                            <a href="openwmap2.html" onclick="localStorage.setItem('selected_city', '${cityName}'); localStorage.setItem('cavanweb_active_name', '${cityName}');" class="inline-block bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-3 py-1 rounded-lg text-xs transition shadow">
                                Visualizza nella Dashboard
                            </a>
                        </div>
                    </div>
                `;

                if (currentMarker) {
                    currentMarker.setLatLng([lat, lon]).setPopupContent(popupContent).openPopup();
                } else {
                    currentMarker = L.marker([lat, lon]).addTo(map).bindPopup(popupContent).openPopup();
                }

            } catch (err) {
                console.error(err);
                if (currentMarker) {
                    currentMarker.setLatLng([lat, lon]).setPopupContent("<p class='p-2 text-red-500 font-semibold'>Impossibile caricare il meteo per questa posizione.</p>").openPopup();
                } else {
                    currentMarker = L.marker([lat, lon]).addTo(map).bindPopup("<p class='p-2 text-red-500 font-semibold'>Impossibile caricare il meteo per questa posizione.</p>").openPopup();
                }
            }
        }

        // Evento click sulla mappa
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            getWeatherByCoords(lat, lon);
        });

        // Caricamento iniziale del tema salvato
        window.onload = () => {
            const savedTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            setTheme(savedTheme);
        };
    </script>
</body>
