<!DOCTYPE html>
<html lang="it" data-theme="cavanweb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Meteo Mondiale</title>
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#728890" id="meta-theme-color">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS (Mappa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; transition: background 0.3s ease, color 0.3s ease; }
        #map { height: calc(100vh - 130px); width: 100vw; border-radius: 0; }
        
        /* Personalizzazione popup mappa dinamica */
        .leaflet-popup-content-wrapper { border-radius: 1rem; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Stile personalizzato per il controllo dei layer */
        .leaflet-control-layers { border-radius: 1rem !important; padding: 8px 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); max-height: 80vh; overflow-y: auto; font-family: 'Inter', sans-serif !important; }
        .leaflet-control-layers label { font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    </style>
</head>
<body class="bg-[#728890] min-h-screen text-slate-900 flex flex-col justify-between" id="app-body">

    <!-- Header Full Width Dinamico -->
    <header id="app-header" class="w-full bg-[#D8D9D0] border-b border-slate-400 px-4 py-3 flex items-center justify-between z-[1000] transition-colors">
        <a href="openwmap2.html" id="back-btn" class="bg-[#728890] hover:bg-[#5d727a] px-3.5 py-2 rounded-xl border border-slate-600/40 shadow transition text-white flex items-center gap-2 text-xs sm:text-sm font-semibold">
            <i class="fa-solid fa-arrow-left text-amber-400"></i>
            <span>Torna al Meteo</span>
        </a>
        <div class="text-center flex-grow mx-2">
            <h1 id="main-title" class="text-lg sm:text-xl font-bold tracking-tight flex items-center justify-center gap-2 text-slate-900">
                <i class="fa-solid fa-earth-americas text-[#800040]" id="title-icon"></i> Mappa Meteo Interattiva
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <!-- Pulsante Cambio Tema -->
            <button onclick="toggleTheme()" id="theme-toggle-btn" title="Cambia Tema" class="bg-[#728890] hover:bg-[#5d727a] text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow transition flex items-center gap-1.5 border border-slate-600/40">
                <i class="fa-solid fa-desktop" id="theme-icon"></i> <span id="theme-label" class="hidden sm:inline">CavanWeb</span>
            </button>
            <!-- Logo CavanWeb -->
            <a href="https://www.cavanweb.com/" target="_blank" class="flex items-center group" title="Visita CavanWeb">
                <img src="SfondoN-512.png" alt="Logo" class="w-9 h-9 rounded-xl object-cover border border-slate-300 shadow group-hover:scale-105 transition">
            </a>
        </div>
    </header>

    <!-- Main Map Container Full Width -->
    <main class="w-full flex-grow relative">
        <div id="map"></div>
        <!-- Istruzione fluttuante in basso -->
        <div id="map-banner" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-[#D8D9D0] backdrop-blur-md px-4 py-2 rounded-full border border-slate-400 text-xs sm:text-sm text-slate-900 font-semibold pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap transition-colors">
            📍 Clicca ovunque sulla mappa per scoprire il meteo della località
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_KEY = "bd940445d9a0cc5d54dc2b7b498ba441";

        // Definizione dei Layer di base
        const darkLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Esri, HERE, Garmin, © OpenStreetMap contributors'
        });

        const lightLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Esri, HERE, Garmin, © OpenStreetMap contributors'
        });

        const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)'
        });

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });

        // Layer delle Situazioni Meteorologiche di OpenWeatherMap con Opacità Massima (1.0)
        const tempLayer = L.tileLayer(`https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const precipLayer = L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const windLayer = L.tileLayer(`https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const pressureLayer = L.tileLayer(`https://tile.openweathermap.org/map/pressure_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        const cloudsLayer = L.tileLayer(`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
            maxZoom: 19, opacity: 1.0, attribution: 'Map data © OpenWeatherMap'
        });

        // Recupera la scelta precedente della mappa di base (default: dark)
        const savedLayerType = localStorage.getItem('preferred_map_layer') || 'dark';
        let defaultLayer = darkLayer;
        if (savedLayerType === 'light') defaultLayer = lightLayer;
        if (savedLayerType === 'topo') defaultLayer = topoLayer;
        if (savedLayerType === 'osm') defaultLayer = osmLayer;

        // Inizializzazione Mappa centrata sull'Europa/Italia
        const map = L.map('map', {
            center: [45.0483, 9.6953],
            zoom: 5,
            layers: [defaultLayer]
        });

        // Mappe di base
        const baseMaps = {
            "🌙 Esri Dark (Scura)": darkLayer,
            "☀️ Esri Light (Chiara)": lightLayer,
            "⛰️ OpenTopoMap": topoLayer,
            "🗺️ OpenStreetMap": osmLayer
        };

        // Livelli sovrapponibili con checkbox
        const overlayMaps = {
            "🌡️ Temperature": tempLayer,
            "🌧️ Precipitazioni (Pioggia)": precipLayer,
            "💨 Vento": windLayer,
            "⏱️ Pressione Atmosferica": pressureLayer,
            "☁️ Copertura Nuvolosa": cloudsLayer
        };

        // Aggiunge il selettore in alto a destra
        L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

        // Salva la preferenza della mappa di base scelta dall'utente
        map.on('baselayerchange', function (e) {
            if (e.name.includes("Dark")) {
                localStorage.setItem('preferred_map_layer', 'dark');
            } else if (e.name.includes("Light")) {
                localStorage.setItem('preferred_map_layer', 'light');
            } else if (e.name.includes("Topo")) {
                localStorage.setItem('preferred_map_layer', 'topo');
            } else {
                localStorage.setItem('preferred_map_layer', 'osm');
            }
        });

        let currentMarker = null;

        // Gestione dei Temi (Scuro, Chiaro, CavanWeb)
        function toggleTheme() {
            const current = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            let next = 'light';
            if (current === 'cavanweb') next = 'light';
            else if (current === 'light') next = 'dark';
            else next = 'cavanweb';
            setTheme(next);
        }

        function setTheme(themeName) {
            localStorage.setItem('cavanweb_theme', themeName);
            const body = document.getElementById('app-body');
            const metaTheme = document.getElementById('meta-theme-color');
            const header = document.getElementById('app-header');
            const mainTitle = document.getElementById('main-title');
            const titleIcon = document.getElementById('title-icon');
            const backBtn = document.getElementById('back-btn');
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            const themeIcon = document.getElementById('theme-icon');
            const themeLabel = document.getElementById('theme-label');
            const mapBanner = document.getElementById('map-banner');

            const styleSheets = document.getElementById('dynamic-theme-styles') || document.createElement('style');
            styleSheets.id = 'dynamic-theme-styles';

            if (themeName === 'dark') {
                body.className = "bg-[#0f172a] min-h-screen text-white flex flex-col justify-between";
                metaTheme.setAttribute("content", "#0f172a");
                header.className = "w-full bg-slate-900/80 backdrop-blur-md border-b border-white/10 px-4 py-3 flex items-center justify-between z-[1000] text-white";
                mainTitle.className = "text-lg sm:text-xl font-bold tracking-tight flex items-center justify-center gap-2 text-white";
                titleIcon.className = "fa-solid fa-earth-americas text-amber-400";
                backBtn.className = "bg-white/10 hover:bg-white/20 px-3.5 py-2 rounded-xl border border-white/20 shadow transition text-blue-200 hover:text-white flex items-center gap-2 text-xs sm:text-sm font-semibold";
                themeToggleBtn.className = "bg-white/10 hover:bg-white/25 text-amber-400 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow transition flex items-center gap-1.5 border border-white/20";
                themeIcon.className = "fa-solid fa-moon";
                themeLabel.textContent = "Scuro";
                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 text-xs sm:text-sm text-blue-200 pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #1e293b !important; color: white !important; }
                    .leaflet-popup-tip { background: #1e293b !important; }
                    .leaflet-control-layers { background: #1e293b !important; color: white !important; border: 1px solid rgba(255,255,255,0.2) !important; }
                    .leaflet-control-layers-separator { border-top: 1px solid rgba(255,255,255,0.2) !important; }
                `;
            } else if (themeName === 'light') {
                body.className = "bg-[#f1f5f9] min-h-screen text-slate-800 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#f1f5f9");
                header.className = "w-full bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between z-[1000] text-slate-800 shadow-sm";
                mainTitle.className = "text-lg sm:text-xl font-bold tracking-tight flex items-center justify-center gap-2 text-slate-900";
                titleIcon.className = "fa-solid fa-earth-americas text-amber-500";
                backBtn.className = "bg-slate-200 hover:bg-slate-300 px-3.5 py-2 rounded-xl border border-slate-300 shadow transition text-slate-800 flex items-center gap-2 text-xs sm:text-sm font-semibold";
                themeToggleBtn.className = "bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow transition flex items-center gap-1.5 border border-amber-600";
                themeIcon.className = "fa-solid fa-sun";
                themeLabel.textContent = "Chiaro";
                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-md px-4 py-2 rounded-full border border-slate-300 text-xs sm:text-sm text-slate-800 font-semibold pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #ffffff !important; color: #1e293b !important; }
                    .leaflet-popup-tip { background: #ffffff !important; }
                    .leaflet-control-layers { background: #ffffff !important; color: #1e293b !important; border: 1px solid rgba(0,0,0,0.15) !important; }
                    .leaflet-control-layers-separator { border-top: 1px solid rgba(0,0,0,0.15) !important; }
                `;
            } else {
                // CavanWeb theme
                body.className = "bg-[#728890] min-h-screen text-slate-900 flex flex-col justify-between";
                metaTheme.setAttribute("content", "#728890");
                header.className = "w-full bg-[#D8D9D0] border-b border-slate-400 px-4 py-3 flex items-center justify-between z-[1000] text-slate-900 shadow-sm";
                mainTitle.className = "text-lg sm:text-xl font-bold tracking-tight flex items-center justify-center gap-2 text-slate-900";
                titleIcon.className = "fa-solid fa-earth-americas text-[#800040]";
                backBtn.className = "bg-[#728890] hover:bg-[#5d727a] px-3.5 py-2 rounded-xl border border-slate-600/40 shadow transition text-white flex items-center gap-2 text-xs sm:text-sm font-semibold";
                themeToggleBtn.className = "bg-[#728890] hover:bg-[#5d727a] text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow transition flex items-center gap-1.5 border border-slate-600/40";
                themeIcon.className = "fa-solid fa-desktop";
                themeLabel.textContent = "CavanWeb";
                mapBanner.className = "absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-[#D8D9D0] backdrop-blur-md px-4 py-2 rounded-full border border-slate-400 text-xs sm:text-sm text-slate-900 font-semibold pointer-events-none shadow-xl z-[999] text-center whitespace-nowrap";

                styleSheets.innerHTML = `
                    .leaflet-popup-content-wrapper { background: #8FBBD0 !important; color: #800040 !important; border: 1px solid rgba(128,0,64,0.3) !important; }
                    .leaflet-popup-tip { background: #8FBBD0 !important; }
                    .leaflet-control-layers { background: #8FBBD0 !important; color: #800040 !important; border: 1px solid rgba(128,0,64,0.3) !important; font-weight: bold; }
                    .leaflet-control-layers-separator { border-top: 1px solid rgba(128,0,64,0.3) !important; }
                `;
            }
            if (!document.getElementById('dynamic-theme-styles')) {
                document.head.appendChild(styleSheets);
            }
        }

        // Funzione per caricare il meteo al click sulla mappa
        async function getWeatherByCoords(lat, lon) {
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=it`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Dati non disponibili");
                const data = await response.json();

                const cityName = data.name || "Località sconosciuta";
                const country = data.sys.country || "";
                const temp = Number(data.main.temp).toFixed(1);
                const feelsLike = Number(data.main.feels_like).toFixed(1);
                const desc = data.weather[0].description;
                const humidity = data.main.humidity;
                const wind = Number(data.wind.speed * 3.6).toFixed(1);

                const popupContent = `
                    <div class="p-2 space-y-1 text-left">
                        <h3 class="font-bold text-base text-amber-500">${cityName} (${country})</h3>
                        <p class="text-2xl font-extrabold">${temp}°C <span class="text-xs font-normal opacity-75">(Percepita ${feelsLike}°C)</span></p>
                        <p class="capitalize text-sm opacity-90">${desc}</p>
                        <hr class="border-current opacity-20 my-1">
                        <div class="text-xs space-y-0.5 opacity-90">
                            <p><i class="fa-solid fa-droplet text-blue-400"></i> Umidità: ${humidity}%</p>
                            <p><i class="fa-solid fa-wind text-teal-400"></i> Vento: ${wind} km/h</p>
                        </div>
                        <div class="pt-2 text-center">
                            <a href="openwmap2.html" onclick="localStorage.setItem('selected_city', '${cityName}')" class="inline-block bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-3 py-1 rounded-lg text-xs transition shadow">
                                Visualizza nella Dashboard
                            </a>
                        </div>
                    </div>
                `;

                if (currentMarker) {
                    currentMarker.setLatLng([lat, lon]).setPopupContent(popupContent).openPopup();
                } else {
                    currentMarker = L.marker([lat, lon]).addTo(map).bindPopup(popupContent).openPopup();
                }

            } catch (err) {
                console.error(err);
                if (currentMarker) {
                    currentMarker.setLatLng([lat, lon]).setPopupContent("<p class='p-2 text-red-500 font-semibold'>Impossibile caricare il meteo per questa posizione.</p>").openPopup();
                } else {
                    currentMarker = L.marker([lat, lon]).addTo(map).bindPopup("<p class='p-2 text-red-500 font-semibold'>Impossibile caricare il meteo per questa posizione.</p>").openPopup();
                }
            }
        }

        // Evento click sulla mappa
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            getWeatherByCoords(lat, lon);
        });

        // Caricamento iniziale del tema salvato
        window.onload = () => {
            const savedTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            setTheme(savedTheme);
        };
    </script>
</body>
</html>
