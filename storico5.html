<script>
        let weatherData = null;

        // Inizializza data e URL
        const today = new Date().toISOString().split('T')[0];
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=45.0483&longitude=9.6953&start_date=2008-01-01&end_date=${today}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,pressure_msl_mean,wind_speed_10m_max,relative_humidity_2m_mean,precipitation_sum&timezone=auto`;

        // Carica i dati UNA sola volta
        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("Errore API: " + response.status);
                return response.json();
            })
            .then(data => {
                weatherData = data.daily;
                const yearSelect = document.getElementById("yearSelect");
                // Crea la lista degli anni
                const years = [...new Set(weatherData.time.map(t => t.split("-")[0]))].reverse();
                
                years.forEach(y => {
                    const opt = document.createElement("option");
                    opt.value = y;
                    opt.innerHTML = y;
                    yearSelect.appendChild(opt);
                });

                yearSelect.onchange = updateTable;
                updateTable(); 
            })
            .catch(err => console.error("Errore:", err));

        function updateTable() {
            if (!weatherData) return; // Protezione se i dati non sono ancora caricati
            
            const selectedYear = document.getElementById("yearSelect").value;
            const tbody = document.querySelector("#weatherTable tbody");
            tbody.innerHTML = "";
            
            for (let i = weatherData.time.length - 1; i >= 0; i--) {
                if (weatherData.time[i].startsWith(selectedYear)) {
                    tbody.innerHTML += `<tr>
                        <td>${weatherData.time[i]}</td>
                        <td>${weatherData.temperature_2m_max[i]}°C</td>
                        <td>${weatherData.apparent_temperature_max[i]}°C</td>
                        <td>${weatherData.temperature_2m_min[i]}°C</td>
                        <td>${weatherData.pressure_msl_mean[i]} hPa</td>
                        <td>${weatherData.wind_speed_10m_max[i]} km/h</td>
                        <td>${weatherData.relative_humidity_2m_mean[i]}%</td>
                        <td>${weatherData.precipitation_sum[i]} mm</td>
                    </tr>`;
                }
            }
        }
    </script>
