<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Storico Meteo Piacenza (1940-1956)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 14px; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #2c3e50; color: white; font-size: 16px; }
        .controls { margin-bottom: 20px; font-size: 18px; }
        select { font-size: 16px; padding: 5px; }
        .loading { font-size: 16px; color: #e67e22; font-weight: bold; margin-left: 15px; }
    </style>
</head>
<body>

    <h1>Storico Meteo Piacenza (1940-1956)</h1>
    
    <div class="controls">
        <label for="yearSelect">Seleziona Anno: </label>
        <select id="yearSelect">
            <option value="">-- Seleziona un anno --</option>
            <option value="1956">1956</option>
            <option value="1955">1955</option>
            <option value="1954">1954</option>
            <option value="1953">1953</option>
            <option value="1952">1952</option>
            <option value="1951">1951</option>
            <option value="1950">1950</option>
            <option value="1949">1949</option>
            <option value="1948">1948</option>
            <option value="1947">1947</option>
            <option value="1946">1946</option>
            <option value="1945">1945</option>
            <option value="1944">1944</option>
            <option value="1943">1943</option>
            <option value="1942">1942</option>
            <option value="1941">1941</option>
            <option value="1940">1940</option>
        </select>
        <span id="loadingStatus" class="loading" style="display: none;">Caricamento in corso...</span>
    </div>

    <table id="weatherTable">
        <thead>
            <tr>
                <th>Data</th><th>Max</th><th>Percepita</th><th>Min</th>
                <th>Pressione</th><th>Vento (Vel. e Dir.)</th><th>Umidità (%)</th><th>Pioggia</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="8">Seleziona un anno dal menu per visualizzare i dati.</td></tr>
        </tbody>
    </table>

    <script>
        function getWindDirection(degrees) {
            const sectors = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            degrees += 22.5;
            if (degrees < 0) degrees = 360 - (Math.abs(degrees) % 360);
            else degrees = degrees % 360;
            return sectors[parseInt(degrees / 45)];
        }

        const yearSelect = document.getElementById("yearSelect");
        const loadingStatus = document.getElementById("loadingStatus");
        const tbody = document.querySelector("#weatherTable tbody");

        yearSelect.onchange = function() {
            const selectedYear = yearSelect.value;
            if (!selectedYear) {
                tbody.innerHTML = '<tr><td colspan="8">Seleziona un anno dal menu per visualizzare i dati.</td></tr>';
                return;
            }

            loadingStatus.style.display = "inline";
            tbody.innerHTML = "";

            const url = `https://archive-api.open-meteo.com/v1/archive?latitude=45.0483&longitude=9.6953&start_date=${selectedYear}-01-01&end_date=${selectedYear}-12-31&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,pressure_msl_mean,wind_speed_10m_max,wind_direction_10m_dominant,relative_humidity_2m_mean,precipitation_sum&timezone=auto`;

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Errore nel caricamento dati");
                    return response.json();
                })
                .then(data => {
                    loadingStatus.style.display = "none";
                    const weatherData = data.daily;
                    
                    for (let i = weatherData.time.length - 1; i >= 0; i--) {
                        const dir = getWindDirection(weatherData.wind_direction_10m_dominant[i]);
                        
                        tbody.innerHTML += `<tr>
                            <td>${weatherData.time[i]}</td>
                            <td>${weatherData.temperature_2m_max[i]}°C</td>
                            <td>${weatherData.apparent_temperature_max[i]}°C</td>
                            <td>${weatherData.temperature_2m_min[i]}°C</td>
                            <td>${weatherData.pressure_msl_mean[i]} hPa</td>
                            <td>${weatherData.wind_speed_10m_max[i]} km/h ${dir}</td>
                            <td>${weatherData.relative_humidity_2m_mean[i]}%</td>
                            <td>${weatherData.precipitation_sum[i]} mm</td>
                        </tr>`;
                    }
                })
                .catch(err => {
                    loadingStatus.style.display = "none";
                    console.error("Errore:", err);
                    tbody.innerHTML = '<tr><td colspan="8" style="color: red;">Errore durante il caricamento dei dati per questo anno.</td></tr>';
                });
        };
    </script>
</body>
</html>
