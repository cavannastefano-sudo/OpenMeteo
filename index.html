<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Archivio Storico Meteo Piacenza 1940-Oggi</title>
    <style>
        body { font-family: sans-serif; margin: 15px; background-color: #f4f4f9; color: #333; }
        .top-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        h1 { margin: 0; font-size: 22px; }
        .refresh-btn, .export-btn { background-color: #2c3e50; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .refresh-btn:hover, .export-btn:hover { background-color: #34495e; }
        .export-btn { background-color: #27ae60; }
        .export-btn:hover { background-color: #219653; }
        .export-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        /* Stile per il logo/link a sinistra del tasto Aggiorna */
        .logo-link { display: inline-flex; align-items: center; text-decoration: none; }
        .logo-img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; transition: transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .logo-img:hover { transform: scale(1.05); }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 15px; }

        table { border-collapse: collapse; width: 100%; background: white; font-size: 14px; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #2c3e50; color: white; font-size: 15px; }
        
        .clickable-date { color: #2980b9; font-weight: bold; cursor: pointer; text-decoration: underline; }
        .clickable-date:hover { color: #1c5980; }

        .controls { margin-bottom: 20px; font-size: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        select { font-size: 16px; padding: 6px; }
        .loading { font-size: 16px; color: #e67e22; font-weight: bold; }
        .current-section { background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #cbd5e1; }
        h2 { color: #2c3e50; margin-top: 0; font-size: 18px; }
        .current-temp { color: #e74c3c; font-weight: bold; font-size: 16px; display: block; margin-top: 4px; }
        .current-apparent { color: #008b8b; font-weight: bold; font-size: 16px; display: block; margin-top: 4px; }
        .current-sub { color: #008b8b; font-weight: bold; font-size: 16px; display: block; margin-top: 4px; }
        .legend { font-size: 13px; color: #555; margin-top: 10px; line-height: 1.5; font-style: italic; }
        .legend-color { color: #008b8b; font-weight: bold; }
        .legend-temp { color: #e74c3c; font-weight: bold; }

        /* Finestra Modale (Zoom Giornaliero) ingrandita */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); overflow-y: auto; }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 30px; border-radius: 10px; width: 95%; max-width: 750px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); position: relative; }
        .close-btn { color: #aaa; float: right; font-size: 32px; font-weight: bold; cursor: pointer; line-height: 20px; }
        .close-btn:hover { color: #000; }
        .modal-title { color: #2c3e50; margin-top: 0; font-size: 24px; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        .detail-table { width: 100%; border-collapse: collapse; margin-top: 20px; white-space: normal; font-size: 16px; }
        .detail-table th, .detail-table td { padding: 12px 15px; text-align: left; border: 1px solid #ddd; }
        .detail-table th { background-color: #2c3e50; color: white; width: 40%; font-size: 16px; }

        .modal-temp-current { color: #e74c3c; font-weight: bold; font-size: 18px; }
        .modal-sub-current { color: #008b8b; font-weight: bold; font-size: 18px; }
        .modal-normal-val { font-size: 18px; font-weight: bold; }

        @media screen and (max-width: 768px) {
            body { margin: 10px; }
            h1 { font-size: 18px; }
            .current-section { padding: 10px; }
            th, td { padding: 8px; font-size: 13px; }
            .current-temp, .current-apparent, .current-sub { font-size: 14px; }
            .modal-content { margin: 10% auto; width: 95%; padding: 15px; }
            .detail-table { font-size: 14px; }
            .detail-table th, .detail-table td { padding: 10px; }
            .modal-temp-current, .modal-sub-current, .modal-normal-val { font-size: 15px; }
        }
    </style>
</head>
