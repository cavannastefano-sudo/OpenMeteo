<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Storico Meteo Piacenza</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 11px; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 4px; text-align: center; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
        .controls { margin-bottom: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Storico Meteo Piacenza</h1>
    
    <div class="controls">
        <label>Seleziona Anno: </label>
        <select id="yearSelect" onchange="loadData()">
            <script>
                for(let y = 2026; y >= 1940; y--) {
                    document.write(`<option value="${y}">${y}</option>`);
                }
            </script>
        </select>
    </div>

    <table id="weatherTable">
        <thead>
            <tr>
                <th>Data</th>
                <th>Condizione</th>
                <th>Max</th>
                <th>Percepita</th>
                <th>Min</th>
                <th>Umidità</th>
                <th>Pressione</th>
                <th>Precip. (mm)</th>
                <th>Neve (cm)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        function getTextCondition(code) {
            if (code == null) return "-";
            if (code <= 1) return "Sereno";
            if (code <= 3) return "Nuvoloso";
            if (code <= 55) return "Pioggia";
            if (code <= 77) return "Neve";
            if (code <= 82) return "Rovesci";
            return "Variabile";
        }

        async function loadData() {
            const year = document.getElementById("yearSelect").value;
            const tbody = document.querySelector("#weatherTable tbody");
            tbody.innerHTML = "<tr><td colspan='9'>Caricamento in corso...</td></tr>";

            const endDate = (year === "2026") ? "2026-07-14" : `${year}-12-31`;

            // URL senza Vento
            const url = `https://archive-api.open-meteo.com/v1/archive?latitude=45.0483&longitude=9.6953&start_date=${year}-01-01&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,relative_humidity_2m_mean,pressure_msl_mean,weather_code,precipitation_sum,snowfall_sum&timezone=auto`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data || !data.daily) {
                    tbody.innerHTML = "<tr><td colspan='9'>Dati non disponibili.</td></tr>";
                    return;
                }
                
                const d = data.daily;
                let htmlRows = "";
                
                for (let i = d.time.length - 1; i >= 0; i--) {
                    htmlRows += `<tr>
                        <td>${d.time[i]}</td>
                        <td>${getTextCondition(d.weather_code[i])}</td>
                        <td>${d.temperature_2m_max[i] ?? '-'}°C</td>
                        <td>${d.apparent_temperature_max[i] ?? '-'}°C</td>
                        <td>${d.temperature_2m_min[i] ?? '-'}°C</td>
                        <td>${d.relative_humidity_2m_mean[i] ?? '-'}%</td>
                        <td>${d.pressure_msl_mean[i] ?? '-'} hPa</td>
                        <td>${d.precipitation_sum[i] ?? '0'} mm</td>
                        <td>${d.snowfall_sum[i] ?? '0'} cm</td>
                    </tr>`;
                }
                tbody.innerHTML = htmlRows;
            } catch (error) {
                tbody.innerHTML = "<tr><td colspan='9'>Errore nel caricamento.</td></tr>";
            }
        }

        loadData();
    </script>
</body>
</html>
