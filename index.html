<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Storico Meteo Piacenza (1940-Oggi)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 11px; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 4px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .controls { margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Storico Meteo Piacenza</h1>
    
    <div class="controls">
        <label for="yearSelect">Seleziona Anno: </label>
        <select id="yearSelect"></select>
    </div>

    <table id="weatherTable">
        <thead>
            <tr>
                <th>Data</th><th>Condizione</th><th>Max</th><th>Percepita</th><th>Min</th>
                <th>Pressione</th><th>Vento</th><th>Direzione</th><th>Pioggia</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let weatherData = null;

        function getConditionInfo(code, dateString) {
            const month = parseInt(dateString.split("-")[1]);
            const isSummer = (month >= 6 && month <= 8);

            // Filtro anomalie: se è estate ed è segnato neve, correggiamo in Variabile
            if (isSummer && code >= 71 && code <= 77) {
                return { text: "Variabile", icon: "⛅" };
            }

            if (code <= 1) return { text: "Sereno", icon: "☀️" };
            if (code <= 3) return { text: "Nuvoloso", icon: "☁️" };
            if (code <= 55) return { text: "Pioggia", icon: "🌧️" };
            if (code <= 77) return { text: "Neve", icon: "❄️" };
            if (code <= 82) return { text: "Rovesci", icon: "⛈️" };
            return { text: "Variabile", icon: "⛅" };
        }

        const url = "https://archive-api.open-meteo.com/v1/archive?latitude=45.0483&longitude=9.6953&start_date=1940-01-01&end_date=2026-07-14&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,weather_code,pressure_msl_mean,wind_speed_10m_max,wind_direction_10m_dominant,precipitation_sum&timezone=auto";

        fetch(url)
            .then(response => response.json())
            .then(data => {
                weatherData = data.daily;
                const yearSelect = document.getElementById("yearSelect");
                const years = [...new Set(weatherData.time.map(t => t.split("-")[0]))].reverse();
                
                years.forEach(y => {
                    const opt = document.createElement("option");
                    opt.value = y;
                    opt.innerHTML = y;
                    yearSelect.appendChild(opt);
                });

                yearSelect.onchange = updateTable;
                updateTable(); 
            });

        function updateTable() {
            const selectedYear = document.getElementById("yearSelect").value;
            const tbody = document.querySelector("#weatherTable tbody");
            tbody.innerHTML = "";
            
            for (let i = weatherData.time.length - 1; i >= 0; i--) {
                if (weatherData.time[i].startsWith(selectedYear)) {
                    // Passiamo anche la data alla funzione per gestire il filtro estivo
                    const cond = getConditionInfo(weatherData.weather_code[i], weatherData.time[i]);
                    
                    tbody.innerHTML += `<tr>
                        <td>${weatherData.time[i]}</td>
                        <td>${cond.icon} ${cond.text}</td>
                        <td>${weatherData.temperature_2m_max[i]}°C</td>
                        <td>${weatherData.apparent_temperature_max[i]}°C</td>
                        <td>${weatherData.temperature_2m_min[i]}°C</td>
                        <td>${weatherData.pressure_msl_mean[i]} hPa</td>
                        <td>${weatherData.wind_speed_10m_max[i]} km/h</td>
                        <td>${weatherData.wind_direction_10m_dominant[i]}°</td>
                        <td>${weatherData.precipitation_sum[i]} mm</td>
                    </tr>`;
                }
            }
        }
    </script>
</body>
</html>
