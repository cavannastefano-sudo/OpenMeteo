<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Storico Meteo Piacenza</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
    </style>
</head>
<body>

    <h1>Storico Temperature Piacenza (Dal 1950 ad oggi)</h1>
    <table id="weatherTable">
        <thead>
            <tr>
                <th>Data</th>
                <th>Temp. Max (°C)</th>
                <th>Temp. Min (°C)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        function getToday() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const today = getToday();
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=45.0483&longitude=9.6953&start_date=1950-01-01&end_date=${today}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById("weatherTable").querySelector("tbody");
                const times = data.daily.time;
                const maxTemps = data.daily.temperature_2m_max;
                const minTemps = data.daily.temperature_2m_min;

                let htmlRows = "";
                // Ciclo invertito: dall'ultimo giorno al primo
                for (let i = times.length - 1; i >= 0; i--) {
                    htmlRows += `<tr>
                        <td>${times[i]}</td>
                        <td>${maxTemps[i] ?? '-'}°C</td>
                        <td>${minTemps[i] ?? '-'}°C</td>
                    </tr>`;
                }
                tbody.innerHTML = htmlRows;
            })
            .catch(error => console.error("Errore:", error));
    </script>
</body>
</html>
