<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Storico Meteo Piacenza</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        table { border-collapse: collapse; width: 100%; background: white; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
    </style>
</head>
<body>

    <h1>Storico Meteo Piacenza (1950-Oggi)</h1>
    <table id="weatherTable">
        <thead>
            <tr>
                <th>Data</th>
                <th>Condizione</th>
                <th>Max (°C)</th>
                <th>Min (°C)</th>
                <th>Pressione (hPa)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        // Funzione per tradurre il codice meteo in simboli
        function getSymbol(code) {
            if (code <= 1) return "☀️";
            if (code <= 3) return "⛅";
            if (code <= 55) return "🌧️";
            if (code <= 77) return "❄️";
            if (code <= 82) return "🌦️";
            return "☁️";
        }

        function getToday() {
            const date = new Date();
            return date.toISOString().split('T')[0];
        }

        const today = getToday();
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=45.0483&longitude=9.6953&start_date=1950-01-01&end_date=${today}&daily=temperature_2m_max,temperature_2m_min,pressure_msl_mean,weather_code&timezone=auto`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById("weatherTable").querySelector("tbody");
                const d = data.daily;
                let htmlRows = "";
                
                for (let i = d.time.length - 1; i >= 0; i--) {
                    htmlRows += `<tr>
                        <td>${d.time[i]}</td>
                        <td>${getSymbol(d.weather_code[i])}</td>
                        <td>${d.temperature_2m_max[i] ?? '-'}°C</td>
                        <td>${d.temperature_2m_min[i] ?? '-'}°C</td>
                        <td>${d.pressure_msl_mean[i] ?? '-'}</td>
                    </tr>`;
                }
                tbody.innerHTML = htmlRows;
            });
    </script>
</body>
</html>
