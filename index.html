<!DOCTYPE html>
<html lang="it" data-theme="cavanweb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Archivio Storico Meteo Globale 1940-Oggi</title>
    <!-- PWA Manifest & Theme -->

            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;

</head>
<body class="bg-[#728890] min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-8" id="app-body">

    <!-- MAIN CONTAINER -->
    <main id="main-container" class="w-full max-w-6xl mx-auto space-y-6 flex-grow">
        <!-- Verrà iniettato via JS -->

    <!-- FOOTER -->
    <footer class="w-full max-w-4xl mx-auto text-center mt-8 text-xs space-y-2">
        <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-2">

            <a href="https://play.google.com/store/apps/details?id=com.cavanweb.com1v10" target="_blank" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border transition shadow text-xs font-semibold group" title="Scarica da Google Play" id="playstore-btn">
                <i class="fa-brands fa-google-play text-amber-400 text-sm group-hover:scale-110 transition"></i>
                <span>Google Play Store</span>
            </a>
        </div>
        <p id="footer-copy">Archivio Storico Meteo • Sviluppato con Tailwind CSS & Open-Meteo API</p>

    <!-- Finestra Modale Zoom Giornaliero -->
    <div id="dayModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden overflow-y-auto p-4 flex items-center justify-center">

            <button onclick="closeModal()" class="absolute top-5 right-5 text-blue-300 hover:text-white text-2xl font-bold">&times;</button>
            <h3 id="modalTitle" class="text-xl font-bold border-b border-white/10 pb-3 text-amber-400">Dettaglio Giorno</h3>
            <div class="overflow-x-auto rounded-2xl border border-white/10">
                <table class="w-full text-left text-sm" id="modalDetailTable">
                    <tbody class="divide-y divide-white/10">
                        <!-- Dettagli inseriti via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentLat = 45.0483;
        let currentLon = 9.6953;
        let currentPlaceName = "Piacenza";

        function toggleTheme() {
            const current = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            let next = 'light';
            if (current === 'cavanweb') next = 'light';
            else if (current === 'light') next = 'dark';
            else next = 'cavanweb';
            setTheme(next);
        }

        function setTheme(themeName) {
            localStorage.setItem('cavanweb_theme', themeName);
            const body = document.getElementById('app-body');
            const metaTheme = document.getElementById('meta-theme-color');
            const footerAppText = document.getElementById('footer-app-text');
            const playStoreBtn = document.getElementById('playstore-btn');
            const footerCopy = document.getElementById('footer-copy');

            if (themeName === 'dark') {
                body.className = "bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 min-h-screen text-white flex flex-col justify-between p-4 sm:p-8";
                metaTheme.setAttribute("content", "#0f172a");
                footerAppText.className = "text-xs text-blue-200";
                playStoreBtn.className = "inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-xl border border-white/20 transition shadow text-xs font-semibold text-white group";
                footerCopy.className = "text-blue-300/60";
            } else if (themeName === 'light') {
                body.className = "bg-[#f1f5f9] min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-8";
                metaTheme.setAttribute("content", "#f1f5f9");
                footerAppText.className = "text-xs text-slate-600";
                playStoreBtn.className = "inline-flex items-center gap-2 bg-slate-200 hover:bg-slate-300 px-3.5 py-1.5 rounded-xl border border-slate-300 transition shadow text-xs font-semibold text-slate-800 group";
                footerCopy.className = "text-slate-500";
            } else {
                body.className = "bg-[#728890] min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-8";
                metaTheme.setAttribute("content", "#728890");
                footerAppText.className = "text-xs text-slate-200";
                playStoreBtn.className = "inline-flex items-center gap-2 bg-[#D8D9D0]/40 hover:bg-[#D8D9D0]/70 px-3.5 py-1.5 rounded-xl border border-slate-600/30 transition shadow text-xs font-semibold text-slate-900 group";
                footerCopy.className = "text-slate-200/80";
            }

            renderLayout();
            renderFavoritesMenu();
            initLocation();
        }

        function renderLayout() {
            const currentTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            const headerContainer = document.getElementById('header-container');
            const mainContainer = document.getElementById('main-container');

            let themeIcon = "fa-palette";
            let themeLabel = "Tema";
            if (currentTheme === 'cavanweb') { themeIcon = "fa-desktop"; themeLabel = "CavanWeb"; }
            else if (currentTheme === 'light') { themeIcon = "fa-sun"; themeLabel = "Chiaro"; }
            else if (currentTheme === 'dark') { themeIcon = "fa-moon"; themeLabel = "Scuro"; }

            const themeButtonHTML = `
                <button onclick="toggleTheme()" title="Cambia Tema" class="${currentTheme === 'dark' ? 'bg-white/10 hover:bg-white/25 text-amber-400 border-white/20' : currentTheme === 'cavanweb' ? 'bg-[#D8D9D0] hover:bg-white text-slate-800 border-slate-400' : 'bg-amber-500 hover:bg-amber-600 text-white border-amber-600'} px-3.5 h-12 rounded-2xl border shadow transition flex items-center justify-center gap-2 text-sm font-semibold flex-shrink-0">
                    <i class="fa-solid ${themeIcon}"></i> <span class="hidden sm:inline">${themeLabel}</span>
                </button>
            `;

            if (currentTheme === 'dark') {
                headerContainer.className = "w-full max-w-5xl mx-auto mb-6 flex items-center justify-between px-2 sm:px-4 relative";
                headerContainer.innerHTML = `
                    <a href="https://www.cavanweb.com/" target="_blank" class="flex items-center group flex-shrink-0" title="Visita CavanWeb">

                    <div class="text-center flex-grow mx-2">
                        <h1 id="mainTitle" class="text-xl sm:text-3xl font-bold tracking-tight mb-0.5 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-calendar-days text-amber-400"></i> Archivio Storico Meteo Globale 1940-Oggi
                        </h1>
                        <p class="text-blue-200 text-xs sm:text-sm">Dati storici e climatologici Open-Meteo</p>

                    <div class="flex items-center gap-2">

                                <div id="favorites-list" class="flex flex-col gap-1 max-h-40 overflow-y-auto py-1"><span class="text-xs text-blue-300/60 px-3 py-1 italic">Nessun preferito salvato</span></div>
                                <div class="border-t border-white/10 my-1"></div>
                                <a href="openwmap2.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-sm font-semibold transition"><i class="fa-solid fa-cloud-sun text-amber-400 w-5 text-center"></i> <span>MeteoCWEB</span></a>
                                <a href="map.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-sm font-semibold transition"><i class="fa-solid fa-earth-americas text-amber-400 w-5 text-center"></i> <span>Mappa Interattiva</span></a>

                                <a href="https://www.blog.cavanweb.com/p/blog-page_31.html" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-sm font-semibold transition"><i class="fa-solid fa-globe text-amber-400 w-5 text-center"></i> <span>Meteo Europa</span></a>
                            </div>
                        </div>
                    </div>

                            <button id="clear-search-btn" onclick="clearLocationInput()" title="Svuota" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-blue-300 hover:text-white transition hidden"><i class="fa-solid fa-circle-xmark text-base"></i></button>
                        </div>
                        <button onclick="searchCustomLocation()" class="bg-amber-500 hover:bg-amber-600 px-5 py-3 rounded-2xl font-semibold text-slate-900 transition shadow-lg flex items-center gap-2 text-sm"><i class="fa-solid fa-magnifying-glass"></i> Cerca</button>
                        <button onclick="useCurrentGPS()" class="bg-white/10 hover:bg-white/20 px-4 py-3 rounded-2xl border border-white/10 transition text-blue-200 hover:text-white flex items-center gap-2 text-sm" title="Usa GPS"><i class="fa-solid fa-location-crosshairs text-amber-400"><span>GPS</span></i></button>
                        <div class="w-full text-xs text-blue-300 pt-1 flex items-center justify-between">
                            <span>Posizione attiva: <span id="currentLocationLabel" class="font-bold text-white">Piacenza (45.05°N, 9.70°E)</span></span>
                            <button onclick="toggleFavorite()" id="fav-btn" title="Preferito" class="text-base text-blue-300 hover:text-amber-400 transition flex items-center gap-1.5 px-2 py-0.5 bg-white/5 rounded-xl border border-white/10"><i id="fav-icon" class="fa-regular fa-star"></i> <span class="text-xs">Preferito</span></button>
                        </div>
                    </div>

                    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-6 shadow-2xl space-y-4">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-400"></i> Meteo Attuale / Oggi (<span id="currentLocationTitle">Piacenza</span>)</h2>
                        <div class="w-full overflow-hidden rounded-2xl border border-white/10">
                            <table id="currentWeatherTable" class="w-full text-left border-collapse text-sm">
                                <tbody class="divide-y divide-white/10 text-blue-100">
                                    <tr><td colspan="2" class="p-4 text-center">Caricamento dati attuali in corso...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="text-xs text-blue-200/80 space-y-1 bg-white/5 p-4 rounded-2xl border border-white/10">
                            <p>ℹ️ <strong>Legenda:</strong></p>
                            <p>• La temperatura attuale è indicata in <span class="text-rose-400 font-bold">rosso grassetto</span> con l'orario di rilevazione.</p>
                            <p>• I valori in <span class="text-teal-300 font-bold">turchese</span> rappresentano i dati attuali con relativi orari (percepita, pressione, vento e umidità) affiancati ai valori giornalieri.</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                                    </select>
                                </div>
                            </div>
                            <div class="flex flex-wrap items-center gap-3 pt-2">
                                <span id="loadingStatus" class="text-amber-400 font-medium text-sm hidden flex items-center gap-2"><div class="animate-spin rounded-full h-4 w-4 border-2 border-amber-400 border-t-transparent"></div> Caricamento...</span>
                                <button id="exportCsvBtn" class="hidden bg-emerald-600 hover:bg-emerald-700 px-4 py-2.5 rounded-xl font-semibold text-white transition shadow text-xs items-center gap-1.5" onclick="exportData('csv')"><i class="fa-solid fa-file-csv"></i> Scarica CSV</button>
                                <button id="exportTxtBtn" class="hidden bg-blue-600 hover:bg-blue-700 px-4 py-2.5 rounded-xl font-semibold text-white transition shadow text-xs items-center gap-1.5" onclick="exportData('txt')"><i class="fa-solid fa-file-lines"></i> Scarica TXT</button>
                            </div>
                        </div>

                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs text-blue-300 mb-1">Da Anno:</label>
                                        <select id="startYearSelect" class="w-full bg-white/5 border border-white/20 rounded-2xl px-3 py-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
                                            <option value="" class="bg-slate-900">-- Inizio --</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-blue-300 mb-1">A Anno:</label>
                                        <select id="endYearSelect" class="w-full bg-white/5 border border-white/20 rounded-2xl px-3 py-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
                                            <option value="" class="bg-slate-900">-- Fine --</option>
                                        </select>
                                    </div>

                                <button id="exportMultiTxtBtn" class="bg-blue-600 hover:bg-blue-700 px-3.5 py-2.5 rounded-xl font-semibold text-white transition shadow text-xs flex items-center gap-1" onclick="directDownloadCustomRange('txt')"><i class="fa-solid fa-file-lines"></i> TXT</button>

                            <table id="weatherTable" class="w-full text-left border-collapse text-sm whitespace-nowrap">
                                <thead>
                                    <tr class="bg-white/10 text-blue-200 border-b border-white/10 sticky top-0 backdrop-blur-md">

                                        <th class="p-3 text-center">Max</th>
                                        <th class="p-3 text-center">Percepita</th>
                                        <th class="p-3 text-center">Min</th>

                                        <th class="p-3 text-center">Umidità</th>
                                        <th class="p-3 text-center">Pioggia / Neve</th>
                                        <th class="p-3 text-center">Alba / Tramonto</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/10 text-blue-100">
                                    <tr><td colspan="9" class="p-6 text-center text-blue-300">Seleziona un anno o un intervallo per visualizzare i dati nella tabella.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else {
                const isCavanWeb = (currentTheme === 'cavanweb');
                const headerBgClass = isCavanWeb ? "bg-[#D8D9D0] border-slate-400" : "bg-white border-slate-200";
                const cardBgClass = isCavanWeb ? "bg-[#D8D9D0] border-slate-400 text-slate-800" : "bg-white border-slate-300 text-slate-800";
                const dropdownBgClass = isCavanWeb ? "bg-[#8FBBD0] border-[#800040]/50" : "bg-white border-slate-200";

                headerContainer.className = `w-full max-w-6xl mx-auto mb-6 ${headerBgClass} border rounded-3xl p-4 shadow-sm space-y-4 relative`;
                headerContainer.innerHTML = `
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">

                                <i class="fa-solid fa-rotate"></i>

                                <div id="favorites-list" class="flex flex-col gap-1 max-h-40 overflow-y-auto py-1"><span class="text-sm ${isCavanWeb ? 'text-[#800040]/70' : 'text-slate-400'} px-3 py-1 italic">Nessun preferito salvato</span></div>
                                <div class="border-t ${isCavanWeb ? 'border-[#800040]/30' : 'border-slate-100'} my-1"></div>
                                <a href="openwmap2.html" class="flex items-center gap-3 px-3 py-2 rounded-lg ${isCavanWeb ? 'hover:bg-[#728890]/40' : 'hover:bg-slate-100'} text-[#800040] text-base font-medium transition"><i class="fa-solid fa-cloud-sun text-[#800040] w-5 text-center"></i> <span>MeteoCWEB</span></a>

                                <a href="https://www.blog.cavanweb.com/p/blog-page_31.html" target="_blank" class="flex items-center gap-3 px-3 py-2 rounded-lg ${isCavanWeb ? 'hover:bg-[#728890]/40' : 'hover:bg-slate-100'} text-[#800040] text-base font-medium transition"><i class="fa-solid fa-globe text-[#800040] w-5 text-center"></i> <span>Meteo Europa</span></a>

            const yearSelect = document.getElementById("yearSelect");

                    const opt2 = document.createElement("option"); opt2.value = y; opt2.textContent = y; startYearSelect.appendChild(opt2);

        function getFavorites() {
            try { return JSON.parse(localStorage.getItem('cavanweb_favorites')) || []; } catch (e) { return []; }
        }

        function saveFavorites(favorites) {
            localStorage.setItem('cavanweb_favorites', JSON.stringify(favorites));
            renderFavoritesMenu();
        }

        function toggleFavorite() {
            if (!currentPlaceName) return;
            let favorites = getFavorites();
            const index = favorites.indexOf(currentPlaceName);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(currentPlaceName);
            saveFavorites(favorites);
            updateFavoriteIcon(currentPlaceName);
        }

        function updateFavoriteIcon(cityName) {
            const currentTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            const favIcon = document.getElementById('fav-icon');
            if (!favIcon) return;
            const favorites = getFavorites();
            const isCavanWeb = (currentTheme === 'cavanweb');

            if (favorites.includes(cityName)) {
                favIcon.className = currentTheme === 'dark' ? "fa-solid fa-star text-amber-400" : (isCavanWeb ? "fa-solid fa-star text-[#800040]" : "fa-solid fa-star text-amber-500");
            } else {
                favIcon.className = currentTheme === 'dark' ? "fa-regular fa-star text-blue-300 hover:text-amber-400" : (isCavanWeb ? "fa-regular fa-star text-[#800040]" : "fa-regular fa-star text-amber-500");
            }
        }

        function renderFavoritesMenu() {
            const favListContainer = document.getElementById('favorites-list');
            if (!favListContainer) return;
            const favorites = getFavorites();
            const currentTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            const isCavanWeb = (currentTheme === 'cavanweb');

            if (favorites.length === 0) {
                favListContainer.innerHTML = `<span class="text-sm ${currentTheme === 'dark' ? 'text-blue-300/60' : (isCavanWeb ? 'text-[#800040]/70' : 'text-slate-400')} px-3 py-1 italic">Nessun preferito salvato</span>`;
                return;
            }

            let html = '';
            favorites.forEach(city => {
                if (currentTheme === 'dark') {
                    html += `<button onclick="loadFavoriteCity('${city}')" class="w-full text-left flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-white/10 text-blue-200 hover:text-white text-base font-semibold transition"><span class="truncate"><i class="fa-solid fa-location-dot text-amber-400 mr-2 text-xs"></i>${city}</span><i class="fa-solid fa-chevron-right text-xs text-blue-300/50"></i></button>`;
                } else {
                    html += `<button onclick="loadFavoriteCity('${city}')" class="w-full text-left flex items-center justify-between px-3 py-2 rounded-lg ${isCavanWeb ? 'hover:bg-[#728890]/40' : 'hover:bg-slate-100'} text-[#800040] text-base font-medium transition"><span class="truncate"><i class="fa-solid fa-location-dot text-[#800040] mr-2 text-xs"></i>${city}</span><i class="fa-solid fa-chevron-right text-xs ${isCavanWeb ? 'text-[#800040]/70' : 'text-slate-400'}"></i></button>`;
                }
            });
            favListContainer.innerHTML = html;
        }

        async function loadFavoriteCity(cityName) {
            toggleArchiveMenu();
            document.getElementById('locationInput').value = cityName;
            handleSearchInput(document.getElementById('locationInput'));
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityName)}&accept-language=it`);
                const data = await response.json();
                if (data && data.length > 0) {
                    currentLat = parseFloat(data[0].lat);
                    currentLon = parseFloat(data[0].lon);
                    currentPlaceName = data[0].display_name.split(',')[0];
                    updateLocationUI();
                } else {
                    alert("Impossibile trovare le coordinate per la località preferita.");
                }
            } catch (e) {
                console.error(e);
                alert("Errore di connessione.");
            }
        }

        function handleSearchInput(input) {
            const clearBtn = document.getElementById('clear-search-btn');
            if (!clearBtn) return;
            if (input.value.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
        }

        function clearLocationInput() {
            const input = document.getElementById('locationInput');
            if (!input) return;
            input.value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            input.focus();
        }

        function toggleArchiveMenu() {
            const dropdown = document.getElementById('archiveDropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        }

        window.addEventListener('click', function(event) {
            if (!event.target.closest('.relative')) {
                const dropdown = document.getElementById('archiveDropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        });

        const currentYear = new Date().getFullYear();
        let cachedYearData = null;
        let cachedCurrentData = null;
        let cachedMultiData = [];

        async function searchCustomLocation() {
            const query = document.getElementById('locationInput').value.trim();
            if (!query) { alert("Inserisci il nome di una località."); return; }
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&accept-language=it`);
                const data = await response.json();
                if (data && data.length > 0) {
                    currentLat = parseFloat(data[0].lat);
                    currentLon = parseFloat(data[0].lon);
                    currentPlaceName = data[0].display_name.split(',')[0];
                    updateLocationUI();
                } else {
                    alert("Località non trovata.");
                }
            } catch (e) {
                console.error(e);
                alert("Errore di connessione durante la ricerca della località.");
            }
        }

        function useCurrentGPS() {
            if (!navigator.geolocation) { alert("La geolocalizzazione non è supportata dal tuo browser."); return; }
            document.getElementById('currentLocationLabel').textContent = "Rilevamento GPS in corso...";
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}&accept-language=it`);
                        const data = await res.json();
                        if (data && data.address) {
                            currentPlaceName = data.address.city || data.address.town || data.address.village || data.address.county || "GPS";
                        }
                    } catch (e) { currentPlaceName = "GPS"; }
                    document.getElementById('locationInput').value = currentPlaceName;
                    handleSearchInput(document.getElementById('locationInput'));
                    updateLocationUI();
                },
                (error) => { alert("Impossibile rilevare la posizione GPS."); updateLocationUI(); },
                { timeout: 10000 }
            );
        }

        function updateLocationUI() {
            localStorage.setItem('cavanweb_active_lat', currentLat);
            localStorage.setItem('cavanweb_active_lon', currentLon);
            localStorage.setItem('cavanweb_active_name', currentPlaceName);

            document.getElementById('currentLocationLabel').textContent = `${currentPlaceName} (${currentLat.toFixed(2)}°N, ${currentLon.toFixed(2)}°E)`;
            document.getElementById('currentLocationTitle').textContent = currentPlaceName;
            
            updateFavoriteIcon(currentPlaceName);
            loadCurrentWeather();
            const yearSelect = document.getElementById("yearSelect");
            const startYearSelect = document.getElementById("startYearSelect");
            const endYearSelect = document.getElementById("endYearSelect");
            if (yearSelect) yearSelect.value = "";
            if (startYearSelect) startYearSelect.value = "";
            if (endYearSelect) endYearSelect.value = "";
            document.querySelector("#weatherTable tbody").innerHTML = '<tr><td colspan="9" class="p-6 text-center text-blue-300">Località aggiornata. Seleziona un anno o un intervallo per visualizzare i dati storici.</td></tr>';
            const csvBtn = document.getElementById("exportCsvBtn");
            const txtBtn = document.getElementById("exportTxtBtn");
            if (csvBtn) csvBtn.classList.add("hidden");
            if (txtBtn) txtBtn.classList.add("hidden");
            cachedYearData = null;
        }

        function formatDateIT(isoDateStr) {
            if (!isoDateStr) return "";
            const parts = isoDateStr.split("-");
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return isoDateStr;
        }

        function formatVal(val, decimals = 1) {
            if (val === undefined || val === null || isNaN(val)) return "N/D";
            return Number(val).toFixed(decimals).replace('.', ',');
        }

        function getWindDirection(degrees) {
            if (degrees === undefined || degrees === null) return "N/D";
            const sectors = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            degrees += 22.5;
            if (degrees < 0) degrees = 360 - (Math.abs(degrees) % 360);
            else degrees = degrees % 360;
            return sectors[parseInt(degrees / 45)];
        }

        function formatTimeWithSeconds(isoString) {
            if (!isoString) return "N/D";
            const timePart = isoString.split("T")[1];
            if (!timePart) return "N/D";
            let cleanTime = timePart.replace("Z", "");
            let parts = cleanTime.split(":");
            if (parts.length === 2) return cleanTime + ":00";
            return cleanTime.substring(0, 8);
        }

        function formatHourOnly(isoString) {
            if (!isoString) return "";
            const timePart = isoString.split("T")[1];
            return timePart ? ` (${timePart.substring(0, 5)})` : "";
        }

        function formatPrecipitation(precip, snowfall, minTemp) {
            let p = (precip !== undefined && precip !== null) ? precip : 0;
            let s = (snowfall !== undefined && snowfall !== null) ? snowfall : 0;
            if (s > 0) return `❄️ ${formatVal(s)} cm`;
            else if (p > 0 && minTemp !== undefined && minTemp !== null && minTemp <= 1.5) return `❄️ ~${formatVal(p * 1.0)} cm (neve)`;
            else return `${formatVal(p)} mm`;
        }

        function loadCurrentWeather() {
            const currentTbody = document.querySelector("#currentWeatherTable tbody");
            if (!currentTbody) return;
            const urlCurrent = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,sunrise,sunset,pressure_msl_mean,wind_speed_10m_max,wind_direction_10m_dominant,relative_humidity_2m_mean,precipitation_sum,snowfall_sum&timezone=auto`;

            currentTbody.innerHTML = '<tr><td colspan="2" class="p-4 text-center">Caricamento dati attuali in corso...</td></tr>';

            fetch(urlCurrent)
                .then(res => res.json())
                .then(data => {
                    cachedCurrentData = data;
                    const current = data.current;
                    const daily = data.daily;
                    if (!daily || !daily.time || daily.time.length === 0) {
                        currentTbody.innerHTML = '<tr><td colspan="2" class="p-4 text-center text-amber-400">Dati attuali non disponibili.</td></tr>';
                        return;
                    }
                    const i = 0;
                    const currTimeStr = formatHourOnly(current ? current.time : null);
                    const formattedDateIT = formatDateIT(daily.time[i]);

                    const currentTemp = (current && current.temperature_2m !== undefined) ? formatVal(current.temperature_2m) + '°C' + currTimeStr : 'N/D';
                    const currentApparent = (current && current.apparent_temperature !== undefined) ? formatVal(current.apparent_temperature) + '°C' + currTimeStr : 'N/D';
                    const currentPressure = (current && current.pressure_msl !== undefined) ? formatVal(current.pressure_msl, 1) + ' hPa' + currTimeStr : 'N/D';
                    const dailyPressure = (daily.pressure_msl_mean[i] !== undefined) ? formatVal(daily.pressure_msl_mean[i], 1) + ' hPa' : 'N/D';

                    const currWindSpeed = (current && current.wind_speed_10m !== undefined) ? current.wind_speed_10m : null;
                    const currWindDirDeg = (current && current.wind_direction_10m !== undefined) ? current.wind_direction_10m : null;
                    const currentWind = currWindSpeed !== null ? `${formatVal(currWindSpeed)} km/h ${getWindDirection(currWindDirDeg)}${currTimeStr}` : 'N/D';
                    const dailyWind = (daily.wind_speed_10m_max[i] !== undefined) ? formatVal(daily.wind_speed_10m_max[i]) + ' km/h ' + getWindDirection(daily.wind_direction_10m_dominant[i]) : 'N/D';

                    const currentHum = (current && current.relative_humidity_2m !== undefined) ? formatVal(current.relative_humidity_2m) + '%' + currTimeStr : 'N/D';
                    const dailyHum = (daily.relative_humidity_2m_mean[i] !== undefined) ? formatVal(daily.relative_humidity_2m_mean[i]) + '%' : 'N/D';

                    const currentPrecip = (current && current.precipitation !== undefined) ? current.precipitation : 0;
                    const currentSnowfall = (daily.snowfall_sum && daily.snowfall_sum[i] !== undefined) ? daily.snowfall_sum[i] : 0;
                    let currentPrecipText = `${formatVal(currentPrecip)} mm${currTimeStr}`;
                    if (currentPrecip > 0 && current.temperature_2m <= 1.5) currentPrecipText = `❄️ ~${formatVal(currentPrecip)} cm${currTimeStr}`;
                    else if (currentSnowfall > 0) currentPrecipText = `❄️ ${formatVal(currentSnowfall)} cm${currTimeStr}`;

                    const dailyPrecip = formatPrecipitation(daily.precipitation_sum[i], daily.snowfall_sum ? daily.snowfall_sum[i] : 0, daily.temperature_2m_min[i]);

                    currentTbody.innerHTML = `
                        <tr class="hover:bg-slate-50/50 transition"><td class="p-3.5 font-semibold w-1/3 border-r border-slate-300">Data</td><td class="p-3.5"><span class="text-amber-500 font-bold cursor-pointer underline" onclick="openCurrentModal()">${formattedDateIT} (Oggi)</span></td></tr>
                        <tr class="hover:bg-slate-50/50 transition"><td class="p-3.5 font-semibold border-r border-slate-300">Temperatura Attuale</td><td class="p-3.5 text-rose-600 font-extrabold text-lg">${currentTemp}</td></tr>
                        <tr class="hover:bg-slate-50/50 transition"><td class="p-3.5 font-semibold border-r border-slate-300">Percepita Attuale</td><td class="p-3.5 text-teal-700 font-bold">${currentApparent}</td></tr>
                        <tr class="hover:bg-slate-50/50 transition"><td class="p-3.5 font-semibold border-r border-slate-300">Temperatura Max</td><td class="p-3.5 font-bold">${formatVal(daily.temperature_2m_max[i])}°C</td></tr>

                currentLon = parseFloat(savedLon);

            }

                    const endYearSelect = document.getElementById("endYearSelect");
                    if (startYearSelect) startYearSelect.value = "";
                    if (endYearSelect) endYearSelect.value = "";

                    const exportCsvBtn = document.getElementById("exportCsvBtn");
                    const exportTxtBtn = document.getElementById("exportTxtBtn");
                    if (loadingStatus) loadingStatus.classList.remove("hidden");
                    if (exportCsvBtn) exportCsvBtn.classList.add("hidden");
                    if (exportTxtBtn) exportTxtBtn.classList.add("hidden");
                    const tbody = document.querySelector("#weatherTable tbody");
                    if (tbody) tbody.innerHTML = "";

                    let endDate = `${selectedYear}-12-31`;
                    if (selectedYear == currentYear) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        endDate = yesterday.toISOString().split("T")[0];
                    }

                    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${currentLat}&longitude=${currentLon}&start_date=${selectedYear}-01-01&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,sunrise,sunset,pressure_msl_mean,wind_speed_10m_max,wind_direction_10m_dominant,relative_humidity_2m_mean,precipitation_sum,snowfall_sum&timezone=auto`;

                            if (!cachedYearData || !cachedYearData.time) {

        async function viewCustomRange() {
            const startYearSelect = document.getElementById("startYearSelect");
            const endYearSelect = document.getElementById("endYearSelect");
            if (!startYearSelect || !endYearSelect) return;
            const startVal = parseInt(startYearSelect.value);
            const endVal = parseInt(endYearSelect.value);
            if (!startVal || !endVal) { alert("Seleziona sia l'anno di inizio che l'anno di fine."); return; }
            if (startVal > endVal) { alert("L'anno di inizio non può essere successivo all'anno di fine."); return; }

            const btn = document.getElementById("viewMultiBtn");
            const loadingMultiStatus = document.getElementById("loadingMultiStatus");
            btn.disabled = true;
            loadingMultiStatus.classList.remove("hidden");

            cachedMultiData = [];
            const tbody = document.querySelector("#weatherTable tbody");
            tbody.innerHTML = '<tr><td colspan="9" class="p-6 text-center text-amber-500 font-bold">Caricamento dati intervallo in corso...</td></tr>';
            const yearSelect = document.getElementById("yearSelect");
            if (yearSelect) yearSelect.value = "";
            document.getElementById("exportCsvBtn").classList.add("hidden");
            document.getElementById("exportTxtBtn").classList.add("hidden");
            cachedYearData = null;

            try {
                for (let y = endVal; y >= startVal; y--) {
                    let endDate = `${y}-12-31`;
                    if (y === currentYear) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        endDate = yesterday.toISOString().split("T")[0];
                    }
                    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${currentLat}&longitude=${currentLon}&start_date=${y}-01-01&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,sunrise,sunset,pressure_msl_mean,wind_speed_10m_max,wind_direction_10m_dominant,relative_humidity_2m_mean,precipitation_sum,snowfall_sum&timezone=auto`;
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const daily = data.daily;
                    if (daily && daily.time) {
                        let yearRows = [];
                        for (let i = 0; i < daily.time.length; i++) {
                            yearRows.push({
                                dateIT: formatDateIT(daily.time[i]),
                                rawDate: daily.time[i],
                                tMax: daily.temperature_2m_max[i],
                                tApp: daily.apparent_temperature_max[i],
                                tMin: daily.temperature_2m_min[i],
                                press: daily.pressure_msl_mean[i],
                                windSpd: daily.wind_speed_10m_max[i],
                                windDirDeg: daily.wind_direction_10m_dominant[i],
                                hum: daily.relative_humidity_2m_mean[i],
                                precip: daily.precipitation_sum[i] || 0,
                                snow: daily.snowfall_sum ? daily.snowfall_sum[i] : 0,
                                sunrise: formatTimeWithSeconds(daily.sunrise[i]),
                                sunset: formatTimeWithSeconds(daily.sunset[i])
                            });
                        }
                        cachedMultiData.push(...yearRows);
                    }
                }
                cachedMultiData.sort((a, b) => b.rawDate.localeCompare(a.rawDate));
                if (cachedMultiData.length > 0) renderMultiTableData();
                else tbody.innerHTML = '<tr><td colspan="9" class="p-6 text-center text-amber-500 font-bold">Nessun dato trovato.</td></tr>';
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="9" class="p-6 text-center text-red-600 font-bold">Errore durante il caricamento.</td></tr>';
            } finally {
                loadingMultiStatus.classList.add("hidden");
                btn.disabled = false;
            }
        }

        async function directDownloadCustomRange(format) {
            const startYearSelect = document.getElementById("startYearSelect");
            const endYearSelect = document.getElementById("endYearSelect");
            if (!startYearSelect || !endYearSelect) return;
            const startVal = parseInt(startYearSelect.value);
            const endVal = parseInt(endYearSelect.value);
            if (!startVal || !endVal) { alert("Seleziona gli anni per il download."); return; }
            if (startVal > endVal) { alert("Intervallo non valido."); return; }

            let tempDownloadRows = [];
            try {
                for (let y = endVal; y >= startVal; y--) {
                    let endDate = `${y}-12-31`;
                    if (y === currentYear) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        endDate = yesterday.toISOString().split("T")[0];
                    }
                    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${currentLat}&longitude=${currentLon}&start_date=${y}-01-01&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,sunrise,sunset,pressure_msl_mean,wind_speed_10m_max,wind_direction_10m_dominant,relative_humidity_2m_mean,precipitation_sum,snowfall_sum&timezone=auto`;
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const daily = data.daily;
                    if (daily && daily.time) {
                        for (let i = 0; i < daily.time.length; i++) {
                            const dateIT = formatDateIT(daily.time[i]);
                            const tMax = formatVal(daily.temperature_2m_max[i]);
                            const tApp = formatVal(daily.apparent_temperature_max[i]);
                            const tMin = formatVal(daily.temperature_2m_min[i]);
                            const press = formatVal(daily.pressure_msl_mean[i], 1);
                            const windSpd = formatVal(daily.wind_speed_10m_max[i]);
                            const windDir = getWindDirection(daily.wind_direction_10m_dominant[i]);
                            const hum = formatVal(daily.relative_humidity_2m_mean[i]);
                            let p = daily.precipitation_sum[i] || 0;
                            let s = daily.snowfall_sum ? daily.snowfall_sum[i] : 0;
                            let precipStr = `${formatVal(p)} mm`;
                            if (s > 0) precipStr = `${formatVal(s)} cm neve`;

                            tempDownloadRows.push({
                                rawDate: daily.time[i],
                                cols: [dateIT, tMax, tApp, tMin, press, `${windSpd} km/h`, windDir, `${hum}%`, precipStr, formatTimeWithSeconds(daily.sunrise[i]), formatTimeWithSeconds(daily.sunset[i])]
                            });
                        }
                    }
                }
                tempDownloadRows.sort((a, b) => b.rawDate.localeCompare(a.rawDate));
                let rows = [["Data", "Temp Max", "Temp Percepita Max", "Temp Min", "Pressione", "Vento", "Direzione Vento", "Umidità", "Pioggia/Neve", "Alba", "Tramonto"]];
                tempDownloadRows.forEach(item => rows.push(item.cols));

                let separator = format === 'csv' ? ';' : '\t';
                let fileExt = format === 'csv' ? 'csv' : 'txt';
                let content = rows.map(e => e.join(separator)).join("\n");
                const blob = new Blob([content], { type: `text/${fileExt};charset=utf-8;` });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `meteo_${currentPlaceName.toLowerCase()}_${startVal}_${endVal}.${fileExt}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                console.error(err);
                alert("Errore durante il download.");
            }
        }

            if (event.target === modal) closeModal();
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('cavanweb_theme') || 'cavanweb';
            setTheme(savedTheme);
        };
    </script>
</body>
</html>
